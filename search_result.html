<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://kfarmai.com/">
  <title>검색 이동 · kFarmAI</title>
  <script>
    (function(){
      const source=new URLSearchParams(location.search);
      const target=new URL('index.html',location.href);
      target.searchParams.set('view','questions');
      target.searchParams.set('sort','latest');
      const query=(source.get('q')||'').trim();
      if(query)target.searchParams.set('q',query);
      location.replace(target.href);
    })();
  </script>
</head>
<body>
  <main><p>통합검색으로 이동합니다. <a id="fallbackLink" href="index.html?view=questions&amp;sort=latest">검색 열기</a></p></main>
  <script>
    const query=(new URLSearchParams(location.search).get('q')||'').trim();
    if(query)document.getElementById('fallbackLink').href=`index.html?view=questions&sort=latest&q=${encodeURIComponent(query)}`;
  </script>
</body>
</html>
