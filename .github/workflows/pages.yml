name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: node scripts/pages/build-pages-artifact.cjs --output=_site

      - name: Verify static site security contract
        run: node scripts/pages/verify-pages-artifact.cjs _site

      - name: Required SEO and sitemap contract tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/seo-publication.test.cjs tests/sitemap-semantic.test.cjs > "$RUNNER_TEMP/kfarmai-seo-contract.log" 2>&1 || { tail -n 32 "$RUNNER_TEMP/kfarmai-seo-contract.log"; exit 1; }
          echo '[Phase SEO contract] PASS'
      - name: Full JavaScript regression baseline audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if node --test tests/*.test.cjs > "$RUNNER_TEMP/kfarmai-node-tests.log" 2>&1; then
            echo '[Phase JS full regression] PASS'
          else
            grep -E '^not ok |^# (tests|pass|fail) ' "$RUNNER_TEMP/kfarmai-node-tests.log" | tail -n 14 || true
            echo '[Phase JS full regression] FAIL: existing and changed-contract failures require review'
            exit 1
          fi
      - name: Install pinned Python test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check PyYAML==6.0.3 > "$RUNNER_TEMP/kfarmai-python-deps.log" 2>&1 || { tail -n 12 "$RUNNER_TEMP/kfarmai-python-deps.log"; exit 1; }
          echo '[Phase Python test dependency] PASS'
      - name: Full Python regression baseline audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if python -m unittest discover -s tests -p 'test_*.py' > "$RUNNER_TEMP/kfarmai-python-tests.log" 2>&1; then
            echo '[Phase Python full regression] PASS'
          else
            tail -n 12 "$RUNNER_TEMP/kfarmai-python-tests.log"
            echo '[Phase Python full regression] FAIL: baseline audit preserved'
            exit 1
          fi
      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Wait for uploaded Pages artifact metadata
        env:
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        shell: python
        run: |
          import json, os, time, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts"
          for attempt in range(12):
              request = urllib.request.Request(url, headers={"Accept": "application/vnd.github+json", "User-Agent": "KFarmAI-Pages"})
              with urllib.request.urlopen(request, timeout=15) as response:
                  artifacts = json.load(response)["artifacts"]
              matches = [item for item in artifacts if item["name"] == os.environ["PAGES_ARTIFACT_NAME"] and not item["expired"]]
              if len(matches) == 1:
                  print("[Phase Pages artifact metadata] PASS")
                  break
              if len(matches) > 1:
                  raise SystemExit("Duplicate Pages artifact metadata")
              if attempt < 11:
                  time.sleep(5)
          else:
              raise SystemExit("Pages artifact metadata did not become available")

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
