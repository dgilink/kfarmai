name: KFarmAI REVIEW Publish Production

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: kfarmai-review-publish-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  publish-approved-review:
    if: >-
      github.repository == 'dgilink/kfarmai' &&
      github.event.issue.pull_request == null &&
      github.actor == github.repository_owner &&
      github.actor_id == '293838055' &&
      startsWith(github.event.comment.body, '/kfarmai ') &&
      vars.KFARMAI_REVIEW_PUBLISH_ENABLED == 'true' &&
      vars.KFARMAI_REVIEW_PUBLISH_APPROVAL_ID != ''
    environment: kfarmai-production-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      issues: write
    env:
      PYTHONUTF8: '1'
      KFARMAI_REVIEW_PUBLISH_ENABLED: ${{ vars.KFARMAI_REVIEW_PUBLISH_ENABLED }}
      KFARMAI_REVIEW_PUBLISH_APPROVAL_ID: ${{ vars.KFARMAI_REVIEW_PUBLISH_APPROVAL_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify activation and compile
        shell: bash
        run: |
          set -euo pipefail
          test "$KFARMAI_REVIEW_PUBLISH_ENABLED" = 'true'
          printf '%s' "$KFARMAI_REVIEW_PUBLISH_APPROVAL_ID" | grep -Eq '^review-[A-Za-z0-9_-]{1,96}$'
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          python -m py_compile \
            automation/kfarmai_review_approval.py \
            automation/kfarmai_post_publish_audit.py \
            automation/review_approval_workflow.py \
            automation/source_policy.py

      - name: Verify protected publication environment
        shell: bash
        run: |
          set -euo pipefail
          env_json="$RUNNER_TEMP/kfarmai-production-environment.json"
          gh api \
            "repos/$GITHUB_REPOSITORY/environments/kfarmai-production-publish" \
            > "$env_json"
          jq -e '.can_admins_bypass == false' "$env_json" > /dev/null
          jq -e '
            any(.protection_rules[]?;
              .type == "required_reviewers" and
              any(.reviewers[]?;
                .reviewer.id == 293838055 and .reviewer.login == "dgilink"))
          ' "$env_json" > /dev/null

      - name: Publish exact approved REVIEW package
        shell: bash
        run: python automation/review_approval_workflow.py --execute
