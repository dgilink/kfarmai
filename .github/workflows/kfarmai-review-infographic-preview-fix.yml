name: KFarmAI REVIEW Infographic Preview Fix

on:
  workflow_dispatch:
    inputs:
      approval_id:
        required: true
        type: string
      artifact_id:
        required: true
        type: string
      manifest_sha256:
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  preview-only:
    if: >-
      github.repository == 'dgilink/kfarmai' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == '293838055' &&
      github.run_attempt == 1 &&
      inputs.approval_id == 'review-39236736411-r2-fb2cfdd0ee4c' &&
      inputs.artifact_id == '12179407364' &&
      inputs.manifest_sha256 == '127932cab29cd6659947fda744e312a7f90c0042c6ed6600e1b9233ccec73d3a'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact public main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install bounded verification runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          grep -qi 'Open Font License' /usr/share/doc/fonts-noto-cjk/copyright
          python -m pip install --no-cache-dir -r automation/requirements-daily-review.txt -r automation/requirements-infographic-preview.txt

      - name: Download and verify immutable Artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/package"
          gh run download 39236736411 --repo "$GITHUB_REPOSITORY" \
            --name review-review-39236736411-r2-fb2cfdd0ee4c --dir "$RUNNER_TEMP/package"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12179407364" > "$RUNNER_TEMP/artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12179407364/zip" > "$RUNNER_TEMP/artifact.zip"
          python automation/daily_review_content_revision.py issue \
            --package "$RUNNER_TEMP/package" --artifact-json "$RUNNER_TEMP/artifact.json" \
            --artifact-zip "$RUNNER_TEMP/artifact.zip" --output "$RUNNER_TEMP/verified.json"

      - name: Rasterize bound SVG for private review preview
        shell: bash
        run: |
          set -euo pipefail
          svg="$RUNNER_TEMP/package/publish/static/kb/greenhouse-heating-preflight-notes-infographic.svg"
          raster_svg="$RUNNER_TEMP/infographic-raster-input.svg"
          png="$RUNNER_TEMP/infographic-preview.png"
          font_file="$(fc-match -f '%{file}' ':family=Noto Sans CJK KR:lang=ko')"
          font_family="$(fc-match -f '%{family[0]}' ':family=Noto Sans CJK KR:lang=ko')"
          test -f "$font_file"
          test "$font_family" = "Noto Sans CJK KR"
          python automation/korean_font_raster_qa.py \
            --source-svg "$svg" --font-file "$font_file" \
            --output-svg "$raster_svg" --report "$RUNNER_TEMP/font-report.json"
          google-chrome --headless=new --disable-gpu --hide-scrollbars --no-sandbox \
            --user-data-dir="$RUNNER_TEMP/chrome-profile" --window-size=1200,845 \
            --screenshot="$png" "file://$raster_svg"
          test -s "$png"
          python automation/daily_review_infographic_preview.py \
            --package "$RUNNER_TEMP/package" --artifact-json "$RUNNER_TEMP/artifact.json" \
            --artifact-zip "$RUNNER_TEMP/artifact.zip" --png "$png" \
            --font-report "$RUNNER_TEMP/font-report.json" \
            --replace-preview-sha256 "4e4df17e0b33c82d2364e8d277c9c031dc399f3c1a7d7f0bba06b80c7883064d" \
            --output "$RUNNER_TEMP/preview-request.json"

      - name: Store private preview without publishing
        env:
          AUDIENCE: https://xzetqijeucldbfgjuoes.supabase.co/functions/v1/daily-review-approval
        shell: bash
        run: |
          set -euo pipefail
          oidc="$(curl --fail-with-body -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r '.value')"
          test -n "$oidc" && test "$oidc" != null
          curl --fail-with-body -sS -X POST "$AUDIENCE" \
            -H "Authorization: Bearer $oidc" -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/preview-request.json" > "$RUNNER_TEMP/preview-response.json"
          jq -e '.state == "PREVIEW_REPLACED" and .published == false' "$RUNNER_TEMP/preview-response.json" > /dev/null
