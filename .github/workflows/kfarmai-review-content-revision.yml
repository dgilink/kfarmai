name: KFarmAI REVIEW Content Revision

on:
  workflow_dispatch:
    inputs:
      approval_id:
        required: true
        type: string
      artifact_id:
        required: true
        type: string
      manifest_sha256:
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: write
  id-token: write

jobs:
  revise-and-reissue:
    if: >-
      github.repository == 'dgilink/kfarmai' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == '293838055' &&
      github.run_attempt == 1 &&
      inputs.approval_id == 'review-39236736411-r2-fb2cfdd0ee4c' &&
      inputs.artifact_id == '12179407364' &&
      inputs.manifest_sha256 == '127932cab29cd6659947fda744e312a7f90c0042c6ed6600e1b9233ccec73d3a'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact public main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install bounded runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          grep -qi 'Open Font License' /usr/share/doc/fonts-noto-cjk/copyright
          python -m pip install --no-cache-dir -r automation/requirements-daily-review.txt -r automation/requirements-infographic-preview.txt

      - name: Verify revision source and build deterministic package
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12179407364" > "$RUNNER_TEMP/old-artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12179407364/zip" > "$RUNNER_TEMP/old-artifact.zip"
          python automation/daily_review_infographic_polish.py build \
            --old-artifact-json "$RUNNER_TEMP/old-artifact.json" \
            --old-artifact-zip "$RUNNER_TEMP/old-artifact.zip" \
            --output "$RUNNER_TEMP/revision-package" \
            --result "$RUNNER_TEMP/revision-result.json" \
            --run-id "$GITHUB_RUN_ID" --head-sha "$GITHUB_SHA"

      - name: Rasterize polished SVG with verified Korean font
        shell: bash
        run: |
          set -euo pipefail
          svg="$RUNNER_TEMP/revision-package/publish/static/kb/greenhouse-heating-preflight-notes-infographic.svg"
          raster_svg="$RUNNER_TEMP/infographic-raster-input.svg"
          png="$RUNNER_TEMP/infographic-preview.png"
          font_file="$(fc-match -f '%{file}' ':family=Noto Sans CJK KR:lang=ko')"
          font_family="$(fc-match -f '%{family[0]}' ':family=Noto Sans CJK KR:lang=ko')"
          test -f "$font_file"
          test "$font_family" = "Noto Sans CJK KR"
          python automation/korean_font_raster_qa.py \
            --source-svg "$svg" --font-file "$font_file" \
            --output-svg "$raster_svg" --report "$RUNNER_TEMP/font-report.json"
          google-chrome --headless=new --disable-gpu --hide-scrollbars --no-sandbox \
            --user-data-dir="$RUNNER_TEMP/chrome-profile" --window-size=1200,805 \
            --screenshot="$png" "file://$raster_svg"
          test -s "$png"

      - name: Upload immutable revision package
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/revision-package/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          overwrite: false

      - name: Verify uploaded Artifact and build revision request
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ARTIFACT_ID" | grep -Eq '^[1-9][0-9]*$'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/new-artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/new-artifact.zip"
          python automation/daily_review_infographic_polish.py request \
            --package "$RUNNER_TEMP/revision-package" \
            --artifact-json "$RUNNER_TEMP/new-artifact.json" \
            --png "$RUNNER_TEMP/infographic-preview.png" \
            --font-report "$RUNNER_TEMP/font-report.json" \
            --output "$RUNNER_TEMP/revision-request.json"

      - name: Supersede old package and send new CONTENT REVIEW email
        env:
          AUDIENCE: https://xzetqijeucldbfgjuoes.supabase.co/functions/v1/daily-review-approval
        shell: bash
        run: |
          set -euo pipefail
          oidc="$(curl --fail-with-body -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r '.value')"
          test -n "$oidc" && test "$oidc" != null
          curl --fail-with-body -sS -X POST "$AUDIENCE" \
            -H "Authorization: Bearer $oidc" -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/revision-request.json" > "$RUNNER_TEMP/revision-response.json"
          jq -e '.state == "SENT" and .published == false and (.provider_message_id | type == "string")' "$RUNNER_TEMP/revision-response.json" > /dev/null

      - name: Rebind Issue 5 to revision package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python automation/daily_review_infographic_polish.py issue \
            --package "$RUNNER_TEMP/revision-package" \
            --artifact-json "$RUNNER_TEMP/new-artifact.json" \
            --artifact-zip "$RUNNER_TEMP/new-artifact.zip" \
            --output "$RUNNER_TEMP/revision-issue.json"
          jq -r .body "$RUNNER_TEMP/revision-issue.json" > "$RUNNER_TEMP/revision-issue.md"
          gh issue edit 5 --repo "$GITHUB_REPOSITORY" \
            --title "$(jq -r .title "$RUNNER_TEMP/revision-issue.json")" \
            --body-file "$RUNNER_TEMP/revision-issue.md"
          new_artifact="$(jq -r .artifact_id "$RUNNER_TEMP/revision-issue.json")"
          new_manifest="$(jq -r .manifest_sha256 "$RUNNER_TEMP/revision-issue.json")"
          gh issue comment 5 --repo "$GITHUB_REPOSITORY" --body \
            "기존 Artifact 12179407364 / Manifest 127932ca…는 인포그래픽 최종 시각 수정으로 superseded 처리했습니다. 새 Artifact ${new_artifact} / Manifest ${new_manifest} 기준으로 CONTENT/PUBLISH 검수를 처음부터 다시 진행합니다. published=false"
