name: KFarmAI Daily AutoPublish

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 KST; GitHub may delay or skip a scheduled run
  workflow_dispatch:
    inputs:
      mode:
        description: "Offline self-test or the protected REVIEW-only path"
        required: true
        default: dry_run
        type: choice
        options: [dry_run, review_only]
      recovery:
        description: "One approved 2026-10-12 incident recovery, otherwise none"
        required: true
        default: none
        type: choice
        options: [none, incident_38209820550]

permissions:
  contents: read

concurrency:
  group: kfarmai-daily-review
  cancel-in-progress: false

jobs:
  daily:
    # The first LIVE run is owner-dispatched only. A cron event cannot enter
    # this job even if GitHub's Workflow state is enabled for manual dispatch.
    if: >-
      github.repository == 'dgilink/kfarmai' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == '293838055' &&
      inputs.mode == 'review_only' &&
      vars.KFARMAI_DAILY_REVIEW_GENERATION_ENABLED == 'true' &&
      vars.KFARMAI_AUTOPUBLISH_ENABLED == 'false' &&
      vars.KFARMAI_REVIEW_PUBLISH_ENABLED == 'false'
    environment: kfarmai-automation-production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      PYTHONUTF8: "1"
      KFARMAI_DAILY_REVIEW_GENERATION_ENABLED: ${{ vars.KFARMAI_DAILY_REVIEW_GENERATION_ENABLED }}
      KFARMAI_AUTOPUBLISH_ENABLED: ${{ vars.KFARMAI_AUTOPUBLISH_ENABLED }}
      KFARMAI_REVIEW_PUBLISH_ENABLED: ${{ vars.KFARMAI_REVIEW_PUBLISH_ENABLED }}
      KFARMAI_DAILY_REVIEW_ONLY: ${{ vars.KFARMAI_DAILY_REVIEW_ONLY }}
      KFARMAI_DAILY_APPROVED_HEAD_SHA: ${{ vars.KFARMAI_DAILY_APPROVED_HEAD_SHA }}
      KFARMAI_DAILY_RECOVERY: ${{ inputs.recovery || 'none' }}
      KFARMAI_DAILY_DB_DSN: ${{ secrets.KFARMAI_DAILY_DB_DSN }}
      KFARMAI_DAILY_DB_CA_PEM: ${{ secrets.KFARMAI_DAILY_DB_CA_PEM }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact run head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Resolve guarded mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REPOSITORY" = 'dgilink/kfarmai'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          if [[ "$GITHUB_EVENT_NAME" == 'schedule' ]]; then
            mode=review_only
          else
            mode='${{ inputs.mode }}'
          fi
          test "$mode" = 'review_only' || test "$mode" = 'dry_run'
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Offline self-test
        if: steps.mode.outputs.mode == 'dry_run'
        shell: bash
        run: |
          set -euo pipefail
          python automation/kfarmai_daily_autopublish.py --root . --mode self_test --output "$RUNNER_TEMP/daily-selftest"

      - name: Install bounded daily runtime
        if: steps.mode.outputs.mode == 'review_only'
        run: python -m pip install --no-cache-dir -r automation/requirements-daily-review.txt

      - name: Generate one verified REVIEW package
        id: generate
        if: steps.mode.outputs.mode == 'review_only'
        shell: bash
        run: |
          set -euo pipefail
          test "$KFARMAI_DAILY_REVIEW_GENERATION_ENABLED" = 'true'
          test "$KFARMAI_AUTOPUBLISH_ENABLED" = 'false'
          test "$KFARMAI_REVIEW_PUBLISH_ENABLED" = 'false'
          test "$KFARMAI_DAILY_REVIEW_ONLY" = 'true'
          test "$KFARMAI_DAILY_APPROVED_HEAD_SHA" = "$GITHUB_SHA"
          test "$(git ls-remote https://github.com/dgilink/kfarmai.git refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          date_kst="$(TZ=Asia/Seoul date +%F)"
          output="$RUNNER_TEMP/daily-review"
          test ! -e "$output"
          python automation/daily_review_runner.py generate --root . --output "$output" \
            --date "$date_kst" --run-id "$GITHUB_RUN_ID" --head-sha "$GITHUB_SHA"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          m=json.loads((Path(os.environ['RUNNER_TEMP'])/'daily-review/approval-package/manifest.json').read_text())
          print('artifact_name=review-'+m['approval_id'])
          PY

      - name: Upload immutable REVIEW package
        id: upload
        if: steps.generate.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.generate.outputs.artifact_name }}
          path: ${{ runner.temp }}/daily-review/approval-package/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          overwrite: false

      - name: Bind Artifact and create one REVIEW Issue
        if: steps.upload.outcome == 'success'
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          printf '%s' "$ARTIFACT_ID" | grep -Eq '^[1-9][0-9]*$'
          output="$RUNNER_TEMP/daily-review"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/daily-artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/daily-artifact.zip"
          jq -n --arg id "$ARTIFACT_ID" --arg digest "$ARTIFACT_DIGEST" --arg url "$ARTIFACT_URL" \
            '{"artifact-id":$id,"artifact-digest":$digest,"artifact-url":$url}' > "$RUNNER_TEMP/daily-upload.json"
          date_kst="$(jq -r .date "$output/outcome.json")"
          python automation/daily_review_runner.py finalize --root . --output "$output" \
            --date "$date_kst" --run-id "$GITHUB_RUN_ID" --head-sha "$GITHUB_SHA" \
            --artifact-json "$RUNNER_TEMP/daily-artifact.json" \
            --artifact-zip "$RUNNER_TEMP/daily-artifact.zip" \
            --upload-outputs "$RUNNER_TEMP/daily-upload.json"

      - name: REVIEW only summary
        if: always() && steps.generate.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'daily-review/outcome.json'
          if p.is_file():
              x=json.loads(p.read_text())
              print('## KFarmAI Daily REVIEW')
              for key in ('status','title','approval_id','manifest_sha256','artifact_id','issue_url','estimated_cost_microusd'):
                  if x.get(key) is not None:
                      print(f'- {key}: {x[key]}')
              print('- published: false')
