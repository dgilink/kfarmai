name: KFarmAI Dev Loop PR Core Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kfarmai-devloop-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout (read only)
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify contracts, KB and Pages artifact
        env:
          DEV_LOOP_REPORT: ${{ runner.temp }}/kfarmai-dev-loop-v1-report.json
        run: node scripts/dev-loop/check.cjs
      - name: Save check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kfarmai-dev-loop-v1-report
          path: ${{ runner.temp }}/kfarmai-dev-loop-v1-report.json
          if-no-files-found: warn
          retention-days: 7

  review-provider-fixture:
    name: Read-only daily REVIEW provider E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (read only)
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned REVIEW runtime and test parser dependencies
        run: python -m pip install --no-cache-dir -r automation/requirements-daily-review.txt PyYAML==6.0.3
      - name: Run isolated REVIEW generation test without credentials
        run: python -m unittest discover -s tests -p test_real_daily_provider.py
      - name: Full Python test suite (record runtime skips)
        run: python -m unittest discover -s tests -p 'test_*.py'

  mobile-windows:
    name: Windows Chrome touch smoke
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout (read only)
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute existing mobile CDP test on Pages artifact
        shell: pwsh
        run: node tests/v4-mobile-nav-scroll.test.mjs
