function openMyDiagnosisDetail(id){
  const list=document.getElementById('myDiagList');
  const item=myDiagnosisRecords.find(row=>String(row.id)===String(id));
  if(!list||!item)return;
  list.innerHTML=`<div class="diagnosis-detail-card">
    <div class="diagnosis-detail-head">
      <div>
        <div class="diagnosis-detail-title">${escHtml(item.crop||'AI 참고 진단 기록')}</div>
        <div class="diagnosis-detail-meta">${escHtml(formatMyDate(item.created_at))}</div>
      </div>
      <button class="my-list-action" type="button" onclick="renderMyDiagnosisList()">목록</button>
    </div>
    <div class="diagnosis-detail-body"><strong>입력한 증상</strong><br>${escDiagPlain(item.symptom||'입력 내용 없음')}</div>
    <div class="diagnosis-detail-body"><strong>AI 참고 진단 결과</strong><br>${formatDiagnosisResult(item.result)}</div>
    <div class="diag-disclaimer">이 내용은 AI 참고 진단 기록입니다. 실제 관리 전에는 공공정보와 재배 환경을 함께 확인해주세요.</div>
    <div class="diagnosis-detail-actions">
      <button class="my-list-action danger" type="button" onclick="deleteMyDiagnosis(event,'${escAttr(item.id)}')">삭제</button>
    </div>
  </div>`;
}
function diagnosisPreviewText(result){
  try{
    const parsed=typeof result==='string'?JSON.parse(result):result;
    const value=parsed?.summary||parsed?.result||parsed?.message||parsed?.answer||'';
    return String(Array.isArray(value)?value.join(' '):value).replace(/\s+/g,' ').slice(0,80);
  }catch(_){
    return String(result||'').replace(/\s+/g,' ').slice(0,80);
  }
}
function escDiagPlain(value){
  return escHtml(value).replace(/\n/g,'<br>');
}
function formatDiagnosisResult(result){
  let parsed=null;
  try{parsed=typeof result==='string'?JSON.parse(result):result;}catch(_){}
  if(parsed&&typeof parsed==='object'){
    const rows=[
      ['요약', parsed.summary],
      ['원인 후보', parsed.causes],

      ['관련 농자재', parsed.materials],

async function saveDiagnosisHistory(symptomText, resultData){
  if(!window._sb)return;

    if(!session?.user?.id)return;
    const selectedCrop='';
    const crop=selectedCrop || '';
    const symptom=symptomText || '';
    const diagResult=typeof resultData==='string'?resultData:JSON.stringify(resultData);
    console.log('진단 저장 시도', {crop, symptom});
    const {error}=await _sb.from('diagnoses').insert({
      user_id: session.user.id,

    });

function formatMyDate(value){
  if(!value)return '';
  const d=new Date(value);
  if(Number.isNaN(d.getTime()))return '';
  return d.toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'});
}
function extractCategoryFromContent(content){
  const match=String(content||'').match(/^\[(?:대표 증상|카테고리):\s*([^\]]+)\]/m);
  return match ? match[1].trim() : '';
}
function extractAuthorNicknameFromContent(content){
  const match=String(content||'').match(/^\[(?:\uC791\uC131\uC790|[^:\]]*):\s*([^\]]+)\]/m);
  return match ? match[1].trim() : '';
}
function extractTagsFromContent(content){
  const match=String(content||'').match(/^\[태그:\s*([^\]]+)\]/m);
  if(!match)return [];
  return match[1].split(/\s+/).map(normalizeTag).filter(Boolean).slice(0,8);
}
function renderPostTags(content,cls='post-tag',storedTags=[]){
  const tags=window.KFCommunity.normalizeTags(storedTags?.length?storedTags:extractTagsFromContent(content));
  return tags.length?`<div class="post-tags">${tags.map(tag=>`<span class="${cls}">${escHtml(tag)}</span>`).join('')}</div>`:'';
}
function stripPostPrefixes(content){
  return String(content||'').replace(/^\[(?:\uC791\uC131\uC790|\uCC44\uB110|\uC9C0\uC5ED|\uB300\uD45C\s*\uC99D\uC0C1|\uD0DC\uADF8|[^:\]]*):\s*[^\]]+\]\s*/gm,'').trim();
}

async function loadFeed(sort=homeFeedSort){
  const feed=document.getElementById('recentFeed');
  if(!feed)return;
  homeFeedSort=['latest','unanswered','helpful'].includes(sort)?sort:'latest';
  feed.dataset.loading='1';
  feed.innerHTML='<div class="feed-loading"><div class="spinner"></div>불러오는 중...</div>';
  try{
    if(!window._sb)throw new Error('Supabase client is not ready');
    const data=await loadSortedQuestionPosts(homeFeedSort,6);
    feed.dataset.loading='0';
    if(!data||data.length===0){
      feed.innerHTML=homeFeedSort==='unanswered'
        ? '<div class="feed-loading">현재 답변을 기다리는 글이 없습니다.</div>'
        : '<div class="feed-loading">아직 등록된 글이 없습니다.</div>';
      return;
    }
    feed.innerHTML='';
    const profileMap=await fetchProfileMap((data||[]).map(post=>post.user_id));
    data.forEach(post=>renderFeedCard(feed, post, profileMap));
  }catch(e){
    feed.dataset.loading='0';
    await renderFeedFallback('현재 커뮤니티 글을 불러오지 못했습니다. 잠시 후 다시 확인해주세요.');
  }
}
function setHomeFeedSort(sort,button){

async function extractFrequentSymptomsFromPosts(){
  try{
    const {data,error}=await _sb.from('posts')
      .select('title,content')
      .order('created_at',{ascending:false})
      .limit(60);
    if(error)throw error;
    const text=(data||[]).map(post=>`${post.title||''} ${post.content||''}`).join(' ').toLowerCase();
    const scored=DEFAULT_SYMPTOM_KEYWORDS.map(keyword=>{
      const score=symptomAliases(keyword).reduce((sum,alias)=>sum+(text.includes(alias.toLowerCase())?1:0),0);
      return {keyword,score};
    }).filter(item=>item.score>0).sort((a,b)=>b.score-a.score);
    return scored.map(item=>item.keyword).concat(DEFAULT_SYMPTOM_KEYWORDS.filter(keyword=>!scored.some(item=>item.keyword===keyword))).slice(0,8);
  }catch(_){
    return [];
  }
}

async function loadSortedQuestionPosts(sort,limit=20){

  const fetchLimit=Math.min(100,Math.max(limit*6,40));
  try{
    const {data,error}=await _sb.from('posts')
      .select('id,user_id,channel_id,category_id,title,content,crop_tag,tags,created_at,region_tag,view_count,image_urls,channels(name, slug),community_categories(name, slug)')
      .not('category_id','is',null)
      .order(orderColumn,{ascending:false})
      .limit(fetchLimit);
    if(error)throw error;
    let posts=await attachCommentCounts(data||[]);
    if(safeSort==='unanswered')posts=posts.filter(post=>Number(post.comment_count)===0);
    if(safeSort==='helpful')posts.sort((a,b)=>Number(b.helpful_count||0)-Number(a.helpful_count||0)||new Date(b.created_at||0)-new Date(a.created_at||0));

    return posts.slice(0,limit);
  }catch(e){
    try{
      const {data}=await _sb.from('posts')
        .select('id,user_id,channel_id,category_id,title,content,crop_tag,tags,created_at,channels(name, slug),community_categories(name, slug)')
        .not('category_id','is',null)
        .order('created_at',{ascending:false})
        .limit(fetchLimit);
      return (await attachCommentCounts(data||[])).slice(0,limit);
    }catch(_){
      return [];
    }
  }
}

async function loadKeywordQuestionPosts(keyword,limit=50){
  if(!window._sb||!keyword)return [];
  const terms=symptomAliases(keyword).concat([keyword]).map(term=>String(term||'').trim()).filter(Boolean);
  const uniqueTerms=[...new Set(terms)].slice(0,8);
  const orQuery=uniqueTerms.flatMap(term=>{
    const safe=term.replace(/^#/,'').replace(/[%_,]/g,'');
    return [`title.ilike.%${safe}%`,`content.ilike.%${safe}%`,`content.ilike.%#${safe}%`,`crop_tag.ilike.%${safe}%`,`region_tag.ilike.%${safe}%`];
  }).join(',');
  try{
    const fields='id,user_id,channel_id,category_id,title,content,crop_tag,tags,created_at,region_tag,view_count,image_urls,channels(name, slug),community_categories(name, slug)';
    const normalizedTag=window.KFCommunity.normalizeTags([keyword])[0]||'';
    const [textResult,tagResult]=await Promise.all([
      _sb.from('posts').select(fields).not('category_id','is',null).or(orQuery).order('created_at',{ascending:false}).limit(limit),
      normalizedTag?_sb.from('posts').select(fields).not('category_id','is',null).contains('tags',[normalizedTag]).order('created_at',{ascending:false}).limit(limit):Promise.resolve({data:[]})
    ]);
    if(textResult.error)throw textResult.error;
    const rows=[...(textResult.data||[]),...(tagResult.data||[])].filter((post,index,all)=>all.findIndex(row=>row.id===post.id)===index).slice(0,limit);
    return await attachCommentCounts(rows);
  }catch(_){
    try{
      const {data}=await _sb.from('posts')
        .select('id,user_id,channel_id,category_id,title,content,crop_tag,tags,created_at,channels(name, slug),community_categories(name, slug)')
        .not('category_id','is',null)
        .order('created_at',{ascending:false})
        .limit(limit);
      const lowered=uniqueTerms.map(term=>term.toLowerCase());
      const filtered=(data||[]).filter(post=>{
        const text=`${post.title||''} ${post.content||''} ${post.crop_tag||''} ${(post.tags||[]).join(' ')}`.toLowerCase();
        return lowered.some(term=>text.includes(term));
      });
      return await attachCommentCounts(filtered);
    }catch(__){
      return [];
    }
  }
}

async function searchPosts(kw,limit){
  if(!window._sb)return [];
  try{
    const cleanKw=String(kw||'').replace(/^#/,'');
    const like=`%${cleanKw.replace(/[%_]/g,'')}%`;
    const hashLike=`%#${cleanKw.replace(/[%_]/g,'')}%`;
    const fields='id,user_id,channel_id,category_id,title,content,crop_tag,tags,region_tag,view_count,created_at,channels(name, slug),community_categories(name, slug)';
    const normalizedTag=window.KFCommunity.normalizeTags([cleanKw])[0]||'';
    const [textResult,tagResult]=await Promise.all([
      _sb.from('posts').select(fields).not('category_id','is',null).or(`title.ilike.${like},content.ilike.${like},content.ilike.${hashLike},crop_tag.ilike.${like},region_tag.ilike.${like}`).order('created_at',{ascending:false}).limit(limit),
      normalizedTag?_sb.from('posts').select(fields).not('category_id','is',null).contains('tags',[normalizedTag]).order('created_at',{ascending:false}).limit(limit):Promise.resolve({data:[]})
    ]);
    let list=[...(textResult.data||[]),...(tagResult.data||[])].filter((post,index,all)=>all.findIndex(row=>row.id===post.id)===index).slice(0,limit);
    if(isInitialQuery(kw)){
      const {data:recent}=await _sb.from('posts').select('id,user_id,channel_id,category_id,title,content,crop_tag,tags,region_tag,view_count,created_at,channels(name, slug),community_categories(name, slug)').not('category_id','is',null).order('created_at',{ascending:false}).limit(40);
      list=(recent||[]).filter(p=>matchesSearchText(`${p.title||''} ${p.content||''} ${(p.tags||[]).join(' ')} ${p.community_categories?.name||''} ${p.channels?.name||''}`,kw)).slice(0,limit);
    }
    return await attachCommentCounts(list);
  }catch(e){return [];}
}

function buildCropRegionalSearchIndex(){
  const data=window.KFARM_CROP_PAGE_DATA;
  if(!data?.core?.length)return [];
  const regionKeywords=['충남','충청남도','경남','경상남도','제주','제주특별자치도','강원','강원특별자치도','경기','경기도','전남','전라남도','전북','전북특별자치도','중부권','남부권','제주권','고랭지'];
  const topicKeywords=['정식','파종','수확','육묘','개화','착과','월동','고랭지','노지','시설재배','텃밭','화분','베란다','과수원','농업날씨'];
  return data.core.flatMap(crop=>{
    const cropTerms=[crop.name,...(crop.aliases||[])].filter(Boolean);
    const monthly=(crop.monthlyCalendar||[]).flatMap(item=>[item.month,item.task,...(item.tasks||[])]);
    const regional=Object.values(crop.regionAdjustments||{}).flat();
    const types=(crop.availableCultivationTypes||[]).flatMap(item=>[item.label,item.note]);
    const publicData=(crop.publicDataConnections||[]).flatMap(item=>[item.label,item.source,item.status,item.note]);
    const materials=(crop.relatedInputs||[]).concat(crop.materials||[]);
    const market=[crop.marketPriceReference?.label,crop.marketPriceReference?.source,crop.marketPriceReference?.note];
    const text=[...cropTerms,...regionKeywords,...topicKeywords,...monthly,...regional,...types,...publicData,...materials,...market,'공공데이터','공공정보','NCPMS','농사로','농약안전사용기준','KAMIS','농산물 시세','농자재 정보','상토','종자','비료','관수','토양검정','실내식물 물주기'].join(' ');
    return [
      {type:'지역 재배달력',title:`${crop.name} 지역 재배달력`,description:'지역과 재배유형 기준으로 월별 작업과 이번 달 할 일을 확인합니다.',url:`crop-calendar.html?crop=${encodeURIComponent(crop.id)}`,keywords:[...cropTerms,...regionKeywords,...topicKeywords],searchText:text},
      {type:'재배가이드',title:`${crop.name} 재배가이드`,description:'선택 지역 관리 포인트와 공공데이터 참고 경로를 확인합니다.',url:`crop-guide.html?crop=${encodeURIComponent(crop.id)}`,keywords:[...cropTerms,'재배가이드','관리포인트',...regionKeywords],searchText:text},
      {type:'농업날씨',title:`${crop.name} 농업날씨 체크`,description:'지역별 기온, 강수, 바람 상태를 함께 확인하는 참고자료입니다.',url:'agri-weather.html',keywords:[...cropTerms,'농업날씨','날씨','강풍','장마','고온','저온'],searchText:text}
    ];
  });
}
async function searchStaticIndex(kw,limit=20){
  const remoteList=await loadStaticSearchIndex();
  const list=LOCAL_SEARCH_INDEX.concat(remoteList||[]).concat(buildCropRegionalSearchIndex());
  const needle=normalizeKeyword(kw).toLowerCase();
  const compact=needle.replace(/\s/g,'');
  const initial=isInitialQuery(needle);
  return list.map(item=>{
    const text=item.searchText||`${item.title||''} ${item.description||''} ${(item.keywords||[]).join(' ')}`.toLowerCase();
    const cho=item.chosung||getInitials(text);
    let score=0;
    if(initial&&cho.includes(needle))score+=90;
    if(text.includes(needle))score+=70;
    if(text.replace(/\s/g,'').includes(compact))score+=50;
    if((item.title||'').toLowerCase().includes(needle))score+=40;
    if((item.keywords||[]).some(k=>String(k).toLowerCase().includes(needle)))score+=25;
    return {...item,score};
  }).filter(item=>item.score>0).sort((a,b)=>b.score-a.score).slice(0,limit);
}

function groupStaticResults(items){
  const grouped={ai:[],questions:[],knowledge:[],community:[],publicData:[],tools:[],materials:[]};
  items.forEach(item=>{
    const type=item.type||'';
    if(type.includes('진단'))grouped.ai.push(item);
    else if(type.includes('관련 질문')||type.includes('질문·정보'))grouped.questions.push(item);
    else if(type.includes('지식'))grouped.knowledge.push(item);
    else if(type.includes('커뮤니티'))grouped.community.push(item);
    else if(type.includes('공공정보')||type.includes('공공데이터'))grouped.publicData.push(item);
    else if(type.includes('도구')||type.includes('계산기'))grouped.tools.push(item);
    else if(type.includes('지역 정보')||type.includes('업체')||type.includes('농약사'))grouped.materials.push(item);
    else grouped.knowledge.push(item);
  });
  return grouped;
}

function matchesSearchText(text,kw){const hay=String(text||'').toLowerCase();const compactHay=hay.replace(/\s/g,'');const needle=String(kw||'').toLowerCase();return hay.includes(needle)||compactHay.includes(needle.replace(/\s/g,''))||getInitials(hay).includes(needle)||SEARCH_ALIASES.some(a=>(a.initial===needle||a.label.includes(needle))&&compactHay.includes(a.label.toLowerCase().replace(/\s/g,'')));}

  if(message.includes('storage')||message.includes('bucket')||message.includes('row-level security')||message.includes('permission')||message.includes('policy'))return '사진 업로드 권한 또는 저장소 설정을 확인해야 합니다.';
  if(message.includes('auth')||message.includes('jwt')||message.includes('session'))return '로그인 상태를 다시 확인해주세요.';
  return '사진 업로드 또는 글 저장에 실패했습니다. Safari에서 직접 열고 다시 시도해주세요.';
}
async function submitPost(){
  if(!window._sb){showToast('인증 준비 중입니다. 잠시 후 다시 시도해주세요.');return;}
  const channelSelect=document.getElementById('channelSelect');
  const categorySlug=channelSelect.value;
  const categoryRecord=window.KFCommunity.categoryBySlug(communityCategories,categorySlug);
  const channelName=categoryRecord?.name||'';
  const category=selectedSymptom();
  const crop=document.getElementById('postCrop')?.value.trim()||'';
  const cultivation=document.getElementById('cultivationSelect')?.value||'';
  const region=document.getElementById('regionSelect')?.value||'';
  const title=document.getElementById('postTitle').value.trim();
  const content=document.getElementById('postContent').value.trim();
  if(!validatePostForm({channelId:categoryRecord?.id,category,title,content}))return;
  const btn=document.getElementById('postSubmitBtn');
  if(btn){btn.dataset.originalText=btn.textContent;btn.textContent='등록 중...';btn.disabled=true;}
  const allowedPayloadKeys=['category_id','title','content','user_id','crop_tag','region_tag','image_urls','tags'];
  let uploaded={urls:[],paths:[]};
  try{
    const {data:{session}}=await window._sb.auth.getSession();
    const userId=session?.user?.id;
    if(!userId){showToast('로그인 후 글을 등록할 수 있습니다.');openMyPanel();return;}
    localStorage.setItem('kfarmai_user_id',userId);
    if(!composeDraft || composeDraftOwner!==userId)throw new Error('초안 저장 준비가 필요합니다. 다시 로그인해주세요.');
    if(await composeDraft.reconcile(window._sb)){
      closeModal(true);selectedPostImages=[];selectedPostTags=[];
      for(const id of ['postTitle','postContent','postCategory','postCrop','cultivationSelect','regionSelect','customSymptom','tagInput']){const field=document.getElementById(id);if(field)field.value='';}
      renderPostImagePreview();renderSelectedTags();await composeDraft.clearAfterSuccess();
      showToast('이미 등록된 글을 확인했습니다. 중복 게시하지 않았습니다.');return;
    }
    await composeDraft.saveNow();
    uploaded=await uploadPostImages(userId);const imageUrls=uploaded.urls;
    const tags=window.KFCommunity.normalizeTags([...selectedPostTags,crop,category,cultivation,region]);
    const payload=cleanPayload({category_id:categoryRecord.id,title,content:contentWithCategory(content,category,channelName,region,tags,displayNameForUser(session.user)),user_id:userId,crop_tag:crop||category||undefined,region_tag:region||undefined,image_urls:imageUrls,tags});
    const payloadKeys=Object.keys(payload);
    const forbiddenPayloadKeys=payloadKeys.filter(key=>!allowedPayloadKeys.includes(key));
    if(forbiddenPayloadKeys.length)throw new Error(`invalid payload keys: ${forbiddenPayloadKeys.join(',')}`);
    postSubmitWarn('posts.insert.start',{payloadKeys,imageCount:imageUrls.length,hasUser:!!userId});
    await composeDraft.beginSubmission(payload);
    const {error}=await window._sb.from('posts').insert(payload).select('id').single();
    if(error)console.warn('post insert error',{message:error.message,payloadKeys});
    if(error)throw error;
    showToast('질문이 등록되었습니다.');
    clearPostValidationErrors();
    closeModal(true);
    ['postTitle','postContent','postCategory','postCrop','cultivationSelect','regionSelect','customSymptom','tagInput'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
    window.autoResizeTextarea?.(document.getElementById('postContent'),220);
    selectedPostImages=[];
    selectedPostTags=[];
    renderPostImageInfo([]);
    renderPostImagePreview();
    renderSelectedTags();
    toggleCustomSymptom();
    await composeDraft.clearAfterSuccess();
    await loadFeed();
    await loadMyCounts(userId);
  }catch(err){showToast(friendlyPostError(err));}
  finally{if(btn){btn.textContent=btn.dataset.originalText||'게시하기';btn.disabled=false;}}
}

let accountDeleteModalHistory = false;
let accountDeletionRequestPending = false;
function openAccountDeleteModal(){
  if(!currentUser){
    showToast('로그인이 필요합니다.');
    openMyPanel();
    return;
  }
  const acknowledge=document.getElementById('accountDeleteAcknowledge');

  document.getElementById('accountDeleteModal')?.classList.add('open');

    history.pushState({accountDeleteModal:true}, '', location.href);

function updateAccountDeleteConfirmState(){
  const btn=document.getElementById('accountDeleteConfirmBtn');
  const acknowledged=document.getElementById('accountDeleteAcknowledge')?.checked===true;
  if(btn)btn.disabled=accountDeletionRequestPending||!acknowledged;
}
function closeAccountDeleteModal(syncHistory=true){
  const modal=document.getElementById('accountDeleteModal');

  }
}
window.addEventListener('popstate',()=>{

async function requestAccountDeletion(){
  if(!_sb||accountDeletionRequestPending){
    showToast('탈퇴 요청 처리 중 문제가 발생했습니다. 잠시 후 다시 시도해주세요.');
    return;
  }
  const btn=document.getElementById('accountDeleteConfirmBtn');
  if(document.getElementById('accountDeleteAcknowledge')?.checked!==true){
    showToast('최종 확인 항목을 선택해주세요.');
    return;
  }
  accountDeletionRequestPending=true;
  if(btn){
    btn.dataset.originalText=btn.textContent;
    btn.textContent='처리 중...';
    btn.disabled=true;
  }
  try{
    const {data:{session}}=await _sb.auth.getSession();
    if(!session?.access_token||!session?.user?.id){
      showToast('로그인이 필요합니다.');
      closeAccountDeleteModal();
      openMyPanel();
      return;
    }
    const endpoint=window.KFAIDiagnosisClient.functionUrl(window.KFAIDiagnosisClient.config.accountDeletionFunction);
    const response=await fetch(endpoint,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},
      body:JSON.stringify({confirmation:'DELETE_MY_ACCOUNT'})
    });
    const result=await response.json().catch(()=>({ok:false}));
    if(!response.ok||result.ok!==true||result.status!=='pending')throw new Error(result.error||`HTTP_${response.status}`);
    await _sb.auth.signOut();
    setMyState(null);
    resetUserUI();
    accountDeleteModalHistory = false;
    closeAccountDeleteModal(false);
    closeMyPanel();
    showToast('계정 삭제 요청이 서버에 접수되었습니다.');
    setTimeout(()=>{ location.href='index.html'; }, 900);
  }catch(error){
    console.error('account deletion request failed', error);
    showToast('탈퇴 요청 처리 중 문제가 발생했습니다. 잠시 후 다시 시도해주세요.');
  }finally{
    accountDeletionRequestPending=false;
    if(btn){
      btn.textContent=btn.dataset.originalText||'탈퇴 요청';
    }
    updateAccountDeleteConfirmState();
  }
}

let googleLoginResetTimer = null;
function authCallbackUrl(){
  return 'https://kfarmai.com/auth-callback.html';
}
function getSupabaseAuthClient(){
  if(window._sb)return window._sb;
  setAuthMessage('인증 준비 중입니다. 잠시 후 다시 시도해주세요.', true);
  showToast('인증 준비 중입니다. 잠시 후 다시 시도해주세요.');
  return null;
}
function summarizeAuthError(error){
  const msg=String(error?.message||'').trim();
  const code=String(error?.code||error?.error_code||'').trim();
  if(/over_email_send_rate_limit|rate|limit/i.test(`${code} ${msg}`))return '이메일 발송 한도에 걸렸습니다. 잠시 후 다시 시도하거나 SMTP 설정을 확인해주세요.';
  if(!msg)return 'Supabase 인증 설정을 확인해주세요.';
  if(/redirect|url|URI/i.test(msg))return '인증 콜백 주소 설정을 확인해주세요.';
  if(/security/i.test(msg))return '요청이 잠시 제한되었습니다. 잠시 후 다시 시도해주세요.';
  if(/email|mail|smtp/i.test(msg))return '이메일 인증 또는 SMTP 설정을 확인해주세요.';
  if(/signup|disabled/i.test(msg))return '이메일 가입 허용 설정을 확인해주세요.';
  return msg;
}
async function sendEmailOtp(){
  const sb=getSupabaseAuthClient();
  if(!sb)return;
  const email=document.getElementById('authEmail')?.value.trim();
  clearAuthMessage();
  if(!email){setAuthMessage('이메일을 입력해주세요.', true);return showToast('이메일을 입력해주세요.');}
  const btn=document.getElementById('emailOtpBtn')||document.getElementById('magicLinkBtn');
  setAuthButtonLoading(btn,true,'인증번호 보내는 중...');
  try{
    let {error}=await sb.auth.signInWithOtp({
      email,
      options:{
        shouldCreateUser:true,
        emailRedirectTo:authCallbackUrl()
      }
    });
    if(error && /redirect|url|URI/i.test(String(error.message||''))){
      console.warn('email otp retrying without redirect option', {
        message:error?.message,
        status:error?.status,
        code:error?.code
      });
      ({error}=await sb.auth.signInWithOtp({
        email,
        options:{shouldCreateUser:true}
      }));
    }
    if(error)throw error;
    const otpBox=document.getElementById('otpVerifyBox');
    if(otpBox)otpBox.style.display='grid';
    document.getElementById('authOtp')?.focus();
    setAuthMessage('인증번호를 이메일로 보냈습니다.\n메일에 표시된 인증번호를 입력해주세요.');
    showToast('인증번호를 보냈습니다. 메일을 확인해주세요.');
  }catch(error){
    console.error('email otp send failed', {
      message:error?.message,
      status:error?.status,
      code:error?.code,
      name:error?.name,
      error
    });
    setAuthMessage(`인증번호를 보내지 못했습니다.\n${summarizeAuthError(error)}`, true);
    showToast('인증번호를 보내지 못했습니다.');
  }finally{
    setAuthButtonLoading(btn,false);
  }
}
const sendMagicLink = sendEmailOtp;
async function verifyEmailOtp(){
  const sb=getSupabaseAuthClient();
  if(!sb)return;
  const email=document.getElementById('authEmail')?.value.trim();
  const token=document.getElementById('authOtp')?.value.trim();
  clearAuthMessage();
  if(!email){setAuthMessage('이메일을 입력해주세요.', true);return showToast('이메일을 입력해주세요.');}
  if(!/^\d{6,8}$/.test(token||'')){setAuthMessage('이메일로 받은 인증번호를 입력해주세요.', true);return showToast('인증번호를 확인해주세요.');}
  const btn=document.getElementById('emailOtpVerifyBtn');
  setAuthButtonLoading(btn,true,'확인 중...');
  try{
    const {data,error}=await sb.auth.verifyOtp({email,token,type:'email'});
    if(error)throw error;
    setAuthMessage('로그인되었습니다.');
    showToast('로그인되었습니다.');
    if(data?.session?.user){
      setMyState(data.session.user);
      updateUserUI(data.session.user);
    }
    document.getElementById('authOtp').value='';
    closeMyPanel();
  }catch(error){
    console.error('email otp verify failed', error);
    setAuthMessage('인증번호 확인에 실패했습니다. 번호를 다시 확인해주세요.', true);
    showToast('인증번호를 다시 확인해주세요.');
  }finally{
    setAuthButtonLoading(btn,false);
  }
}
