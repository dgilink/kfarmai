<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>작물별 재배달력 - kFarmAI</title>
<link rel="icon" href="/static/kfarmai-logo-horizontal.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}a{text-decoration:none;color:inherit}button,input,select{font:inherit}.app{max-width:480px;min-height:100dvh;margin:0 auto;background:#f5f6f8}.header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #eceef2;padding:12px 14px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand img{max-width:170px;height:auto}.home{border:1px solid #cdebdd;background:#e8f6f0;color:#157a5a;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:900}h1{font-size:22px;margin:12px 0 6px;letter-spacing:0}.sub{margin:0;color:#6b7280;font-size:13px;line-height:1.55}.content{padding:14px 14px 88px}.card{background:#fff;border:1px solid #eceef2;border-radius:8px;padding:14px;margin-bottom:10px;box-shadow:0 8px 24px rgba(17,24,39,.05)}.section-title{font-size:16px;font-weight:900;margin:0 0 10px}.search{display:grid;grid-template-columns:1fr;gap:8px}.search input,.select{width:100%;height:43px;border:1.5px solid #dde5e0;border-radius:8px;background:#fff;padding:0 12px;font-weight:800;color:#111827}.chosung{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.chip,.pill{border:1px solid #dde5e0;background:#fff;border-radius:999px;padding:7px 9px;font-size:12px;font-weight:900;color:#374151;white-space:nowrap}.chip.active{background:#111827;color:#fff;border-color:#111827}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.crop-card{min-height:116px;border:1px solid #e5e7eb;background:#fff;border-radius:8px;padding:12px;text-align:left}.crop-card.featured{border-color:#bfe7d7;background:#f3fbf7}.thumb{height:46px;border-radius:8px;background:linear-gradient(135deg,#edf7f2,#f8fafc);display:flex;align-items:center;justify-content:center;color:#157a5a;font-weight:900;font-size:12px;margin-bottom:9px;text-align:center}.crop-name{font-size:16px;font-weight:950}.crop-desc{font-size:12px;color:#6b7280;line-height:1.45;margin-top:5px}.badge-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:10px;font-weight:900}.safe{background:#fff8e1;border-color:#fde68a;color:#5d4400;font-size:12px;line-height:1.6;font-weight:800}.empty{border:1px dashed #cbd5e1;background:#fff;border-radius:8px;padding:14px;color:#475569;font-size:13px;line-height:1.6}.detail-head{display:grid;grid-template-columns:78px 1fr;gap:12px;align-items:center}.photo{height:78px;border-radius:8px;background:#edf7f2;border:1px solid #dcefe6;display:flex;align-items:center;justify-content:center;text-align:center;color:#157a5a;font-size:12px;font-weight:900;padding:8px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.controls .select.full{grid-column:1/-1}.month{border-top:1px solid #edf0f4;padding-top:12px;margin-top:12px}.month:first-child{border-top:0;margin-top:0;padding-top:0}.month h3{font-size:15px;margin:0 0 8px}.task{border:1px solid #e5e7eb;background:#f8fafc;border-radius:8px;padding:10px;margin-top:7px}.task b{font-size:13px}.task p{margin:5px 0 0;color:#4b5563;font-size:12.5px;line-height:1.55}.task.high{border-color:#fed7aa;background:#fff7ed}.gallery{display:grid;grid-template-columns:1fr;gap:8px}.placeholder{border:1px dashed #cbd5e1;border-radius:8px;background:#f8fafc;padding:12px;color:#475569;font-size:12.5px;line-height:1.6}.source{display:inline-flex;align-items:center;gap:5px;margin:4px 4px 0 0;padding:5px 8px;border-radius:999px;background:#ecfdf5;color:#166534;font-size:11px;font-weight:900}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions a{min-height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;background:#e8f6f0;color:#157a5a;border:1px solid #cdebdd;font-size:12px;font-weight:900}.actions a.dark{background:#111827;color:#fff;border-color:#111827}@media (max-width:360px){.grid{grid-template-columns:1fr}.controls{grid-template-columns:1fr}.detail-head{grid-template-columns:1fr}.photo{height:64px}}
</style>
</head>
<body>
<main class="app">
  <header class="header">
    <div class="top"><a class="brand" href="index.html"><img src="/static/kfarmai-logo-horizontal.png" alt="kFarmAI"></a><a class="home" href="index.html">홈</a></div>
    <h1>작물별 재배달력</h1>
    <p class="sub">작물, 지역, 시설/노지 조건에 맞춰 월별·주차별 확인 포인트를 봅니다. 공식 사진은 검수된 항목만 표시합니다.</p>
  </header>
  <section class="content">
    <div class="card search" aria-label="작물 검색">
      <input id="searchInput" type="search" placeholder="작물명, 별칭, 초성 검색 예: 딸기, ㄱㅊ, 방울토마토">
      <div id="chosungTabs" class="chosung"></div>
    </div>
    <section class="card" id="featuredSection"><h2 class="section-title">추천 인기작물</h2><div id="featuredGrid" class="grid"></div></section>
    <section class="card"><h2 class="section-title">전체 작물 23개</h2><div id="cropGrid" class="grid"></div><div id="emptyState" class="empty" hidden>공식 데이터 준비 중입니다. 다른 작물명이나 초성으로 다시 검색해보세요.</div></section>
    <section id="detail"></section>
  </section>
</main>
<script>
'use strict';
const APPROVED='approved';
const REGIONS=[['all','전체'],['central','중부권'],['southern','남부권'],['jeju','제주'],['highland','고랭지/산간']];
const CULTIVATIONS=[['open_field','노지'],['greenhouse','시설'],['not_applicable','해당 없음']];
const state={data:null,crop:null,query:'',chosung:''};
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function norm(v){return String(v||'').toLowerCase().replace(/\s+/g,'')}
function approved(rows){return (rows||[]).filter(row=>row.status===APPROVED)}
function sourceBadge(name){return `<span class="source">출처: ${esc(name)}</span>`}
function officialImages(cropId,type){return approved(state.data.crop_images).filter(x=>x.crop_id===cropId&&x.image_type===type&&x.is_official_source)}
function cropById(id){return state.data.crops.find(c=>c.id===id)}
function defaultVariant(cropId){return approved(state.data.crop_variants).find(v=>v.crop_id===cropId&&v.is_default)||approved(state.data.crop_variants).find(v=>v.crop_id===cropId)}
function variants(cropId){return approved(state.data.crop_variants).filter(v=>v.crop_id===cropId)}
function matchCrop(crop){const q=norm(state.query);const cs=state.chosung;if(cs&&crop.chosung!==cs)return false;if(!q)return true;return [crop.name_ko,crop.name_en,crop.chosung,...(crop.aliases||[])].some(v=>norm(v).includes(q))}
function CropCard(crop,featured=false){return `<button class="crop-card ${featured?'featured':''}" data-crop="${esc(crop.id)}"><div class="thumb">공식 사진<br>준비 중</div><div class="crop-name">${esc(crop.name_ko)}</div><div class="crop-desc">${esc(crop.description_short)}</div><div class="badge-row"><span class="badge">${esc(crop.priority_grade)}등급</span>${crop.is_featured?'<span class="badge">추천</span>':''}</div></button>`}
function renderCropLists(){const crops=approved(state.data.crops).sort((a,b)=>a.display_order-b.display_order);const filtered=crops.filter(matchCrop);$('featuredGrid').innerHTML=crops.filter(c=>c.is_featured).slice(0,10).map(c=>CropCard(c,true)).join('');$('cropGrid').innerHTML=filtered.map(c=>CropCard(c)).join('');$('emptyState').hidden=filtered.length>0;document.querySelectorAll('[data-crop]').forEach(btn=>btn.onclick=()=>selectCrop(btn.dataset.crop));}
function renderChosung(){const tabs=['전체',...new Set(approved(state.data.crops).map(c=>c.chosung).filter(Boolean))];$('chosungTabs').innerHTML=tabs.map(t=>`<button class="chip ${(!state.chosung&&t==='전체')||state.chosung===t?'active':''}" data-cho="${t==='전체'?'':esc(t)}">${esc(t)}</button>`).join('');document.querySelectorAll('[data-cho]').forEach(btn=>btn.onclick=()=>{state.chosung=btn.dataset.cho;renderChosung();renderCropLists();});}
function availableConditions(cropId,variantId){return approved(state.data.crop_conditions).filter(c=>c.crop_id===cropId&&(!variantId||c.variant_id===variantId)&&c.is_available)}
function pickCondition(cropId,variantId){return availableConditions(cropId,variantId).find(c=>c.region_group==='all')||availableConditions(cropId,variantId)[0]}
function CropConditionSelector(crop,variant,condition){const vs=variants(crop.id);const conds=availableConditions(crop.id,variant.id);const regions=REGIONS.filter(([v])=>conds.some(c=>c.region_group===v));const cults=CULTIVATIONS.filter(([v])=>conds.some(c=>c.cultivation_type===v));return `<div class="controls"><select id="variantSelect" class="select full">${vs.map(v=>`<option value="${esc(v.id)}"${v.id===variant.id?' selected':''}>${esc(v.variant_name)}</option>`).join('')}</select><select id="regionSelect" class="select">${regions.map(([v,l])=>`<option value="${v}"${v===condition.region_group?' selected':''}>${l}</option>`).join('')}</select><select id="cultivationSelect" class="select">${cults.map(([v,l])=>`<option value="${v}"${v===condition.cultivation_type?' selected':''}>${l}</option>`).join('')}</select></div>`}
function CropCalendar(crop,variant,condition){let tasks=approved(state.data.crop_calendar).filter(t=>t.crop_id===crop.id&&t.variant_id===variant.id&&t.condition_id===condition.id);if(!tasks.length)tasks=approved(state.data.crop_calendar).filter(t=>t.crop_id===crop.id&&t.variant_id===variant.id);const groups=[...new Set(tasks.map(t=>t.month))].sort((a,b)=>a-b);return groups.map(month=>`<div class="month"><h3>${month}월</h3>${tasks.filter(t=>t.month===month).sort((a,b)=>a.week-b.week).map(t=>`<div class="task ${t.importance==='high'?'high':''}"><b>${t.week}주차 · ${esc(t.task_title)}</b><p>${esc(t.task_description)}</p></div>`).join('')}</div>`).join('')||'<div class="empty">선택 조건의 공식 데이터 준비 중입니다.</div>'}
function CurrentTasks(crop,variant,condition){const now=new Date();const month=now.getMonth()+1;const week=Math.min(5,Math.ceil(now.getDate()/7));let tasks=approved(state.data.crop_calendar).filter(t=>t.crop_id===crop.id&&t.variant_id===variant.id&&t.condition_id===condition.id);if(!tasks.length)tasks=approved(state.data.crop_calendar).filter(t=>t.crop_id===crop.id&&t.variant_id===variant.id);let current=tasks.filter(t=>t.month===month);if(!current.length)current=tasks.slice(0,3);return `<section class="card"><h2 class="section-title">이번 달/이번 주 해야 할 일</h2>${current.slice(0,4).map(t=>`<div class="task ${t.week===week?'high':''}"><b>${t.month}월 ${t.week}주차 · ${esc(t.task_title)}</b><p>${esc(t.task_description)}</p></div>`).join('')}</section>`}
function Gallery(crop,type,title){const imgs=officialImages(crop.id,type);return `<section class="card"><h2 class="section-title">${esc(title)}</h2>${imgs.length?`<div class="gallery">${imgs.map(img=>`<figure class="placeholder"><img src="${esc(img.local_path||img.original_image_url)}" alt="${esc(img.title)}"><figcaption>${esc(img.title)} ${sourceBadge(img.source_name)}</figcaption></figure>`).join('')}</div>`:`<div class="placeholder">공식 사진 준비 중입니다. 공식 원문 이미지, 출처명, 라이선스가 검수 승인되면 표시됩니다.</div>`}</section>`}
function PestDiseaseGallery(crop){const rows=approved(state.data.pest_disease_items).filter(x=>x.crop_id===crop.id);return `<section class="card"><h2 class="section-title">이상증상/병해충 실사</h2>${rows.map(r=>`<div class="task"><b>${esc(r.name_ko)}</b><p>${esc(r.symptoms)} ${esc(r.occurrence_condition)}</p></div>`).join('')}<div class="placeholder">실사 이미지는 공식 출처와 라이선스 검수 후 표시합니다.</div>${sourceBadge('국가농작물병해충관리시스템 NCPMS')}</section>`}
function CropAiDiagnosisCTA(crop){return `<div class="card actions"><a class="dark" href="diagnosis.html?crop=${encodeURIComponent(crop.name_ko)}">AI 참고 진단 연결</a><a href="crop-guide.html?crop=${encodeURIComponent(crop.name_ko)}">재배가이드 보기</a><a href="agri-weather.html">농업날씨 확인</a><a href="public-data.html">공공정보 확인</a></div>`}
function selectCrop(cropId,variantId){const crop=cropById(cropId);if(!crop)return;state.crop=crop;const variant=variantId?variants(crop.id).find(v=>v.id===variantId):defaultVariant(crop.id);const condition=pickCondition(crop.id,variant.id);renderDetail(crop,variant,condition);history.replaceState(null,'',`?crop=${encodeURIComponent(crop.name_ko)}`);setTimeout(()=>$('detail').scrollIntoView({behavior:'smooth',block:'start'}),0)}
function renderDetail(crop,variant,condition){$('detail').innerHTML=`<section class="card"><div class="detail-head"><div class="photo">공식 대표사진<br>준비 중</div><div><h2 class="section-title">${esc(crop.name_ko)}</h2><p class="sub">${esc(crop.description_short)}</p><div class="badge-row"><span class="badge">${esc(crop.priority_grade)}등급</span><span class="badge">${esc(crop.chosung)}</span></div></div></div>${CropConditionSelector(crop,variant,condition)}</section>${CurrentTasks(crop,variant,condition)}<section class="card"><h2 class="section-title">맞춤 재배달력</h2>${CropCalendar(crop,variant,condition)}${sourceBadge('농촌진흥청 농사로')}</section>${Gallery(crop,'growth_stage','생육단계별 공식 사진')}${PestDiseaseGallery(crop)}<section class="card safe">재배달력은 지역, 품종, 시설/노지 조건에 따라 달라질 수 있는 참고자료입니다. 농약 사용 전 등록 작물, 병해충, 사용시기, 희석배수, 안전사용기준을 반드시 확인하세요.</section>${CropAiDiagnosisCTA(crop)}`;$('variantSelect').onchange=e=>selectCrop(crop.id,e.target.value);$('regionSelect').onchange=updateCondition;$('cultivationSelect').onchange=updateCondition}
function updateCondition(){const crop=state.crop;const variant=variants(crop.id).find(v=>v.id===$('variantSelect').value);const region=$('regionSelect').value;const cultivation=$('cultivationSelect').value;const condition=availableConditions(crop.id,variant.id).find(c=>c.region_group===region&&c.cultivation_type===cultivation)||pickCondition(crop.id,variant.id);renderDetail(crop,variant,condition)}
function init(data){state.data=data;renderChosung();renderCropLists();$('searchInput').oninput=e=>{state.query=e.target.value;renderCropLists()};const q=new URLSearchParams(location.search).get('crop');const crop=approved(data.crops).find(c=>c.name_ko===q||c.id===q)||approved(data.crops).find(c=>c.is_featured);if(crop)selectCrop(crop.id)}
fetch('data/crops_mvp.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('crops');return r.json()}).then(init).catch(()=>{$('cropGrid').innerHTML='<div class="empty">작물 데이터를 불러오지 못했습니다. 잠시 후 다시 확인하거나 공식 공공데이터 제공처를 확인해주세요.</div>'});
</script>
</body>
</html>
