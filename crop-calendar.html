<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>재배달력 - kFarmAI</title>
<link rel="icon" href="/static/kfarmai-logo-horizontal.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0a0a0a;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}a{text-decoration:none;color:inherit}.app{max-width:480px;min-height:100dvh;margin:0 auto;background:#F5F6F8}.header{background:#fff;border-bottom:1px solid #ECEEF2;padding:12px 14px 14px}.top{display:flex;align-items:center;justify-content:space-between}.brand img{max-width:180px;height:auto}.home{border:1px solid #CDEBDD;background:#E8F6F0;color:#157A5A;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:900}h1{margin-top:12px;font-size:23px}.sub{margin-top:7px;color:#6B7280;font-size:13px;line-height:1.55}.content{padding:14px 14px 90px}.select{width:100%;height:42px;border:1.5px solid #DDE5E0;border-radius:12px;padding:0 12px;background:#fff;font-weight:800;margin-bottom:10px}.card{background:#fff;border:1px solid #ECEEF2;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 8px 24px rgba(17,24,39,.05)}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;background:#E8F6F0;color:#157A5A;font-size:11px;font-weight:900;margin:2px}.title{font-size:17px;font-weight:900;margin-bottom:8px}.month{margin-top:12px;padding-top:12px;border-top:1px solid #ECEEF2}.month:first-child{margin-top:0;padding-top:0;border-top:0}.month-head{font-size:14px;font-weight:900;color:#111827}.tasks{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.task{display:inline-flex;border-radius:999px;padding:6px 8px;background:#F8FAFC;border:1px solid #E5E7EB;color:#374151;font-size:11px;font-weight:850}.safe{background:#FFF8E1;border-color:#FDE68A;color:#5D4400;font-size:12px;line-height:1.6;font-weight:800}.status{background:#ECFDF5;border-color:#BBF7D0;color:#166534;font-size:12px;line-height:1.6;font-weight:800}.cta{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cta a{min-height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;background:#E8F6F0;color:#157A5A;border:1px solid #CDEBDD;font-size:12px;font-weight:900}.cta a:nth-child(2n){background:#111827;color:#fff;border-color:#111827}.error{background:#fff;border:1px solid #FED7AA;color:#9A3412;border-radius:16px;padding:14px;margin-bottom:10px;font-size:13px;line-height:1.6;font-weight:800}
</style>
</head>
<body>
<main class="app">
  <header class="header">
    <div class="top"><a class="brand" href="index.html"><img src="/static/kfarmai-logo-horizontal.png" alt="kFarmAI"></a><a class="home" href="index.html">홈</a></div>
    <h1>작물별 재배달력</h1>
    <p class="sub">대표 작물의 현재 월 작업과 월별 작업 흐름을 공공데이터 기반 확장 예정 구조로 정리합니다.</p>
  </header>
  <section class="content">
    <select id="crop" class="select" aria-label="작물 선택"></select>
    <div class="card status">재배달력은 현재 정적 참고 데이터이며, 향후 농촌진흥청 농작업일정 정보와 농사로 농작업 일정으로 확장할 예정입니다.</div>
    <div id="summary"></div>
    <div id="detail"></div>
    <div class="card safe">재배달력은 지역, 품종, 시설재배 여부에 따라 달라질 수 있는 참고자료입니다. 실제 일정은 지역 농업기술센터와 공식 재배자료를 함께 확인하세요.</div>
    <div class="cta"><a href="crop-guide.html">재배가이드 보기</a><a href="agri-weather.html">농업날씨 확인</a><a href="channel.html">관련 질문 보기</a><a href="public-data.html">공공정보 확인</a></div>
  </section>
</main>
<script>
'use strict';
const FALLBACK=[{crop:'고추',category:'과채류',currentMonthTasks:['고온기 시듦과 토양 수분 상태를 확인하세요.'],months:[{month:5,tasks:['정식 후 활착 상태와 관수 상태를 확인하세요.']},{month:7,tasks:['고온기 시듦, 지주대, 물관리 상태를 확인하세요.']}],relatedWeather:'고온, 강수, 습도, 풍속을 농업날씨에서 함께 확인하세요.',relatedGuide:'crop-guide.html?crop=고추',publicSources:['농촌진흥청_농작업일정 정보'],notice:'지역과 품종에 따라 차이가 있을 수 있으므로 공식 정보를 함께 확인하세요.'}];
function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
let data=FALLBACK;
function monthLabel(v){return typeof v==='number'?`${v}월`:String(v||'월별')}
function draw(){const c=data.find(x=>x.crop===crop.value)||data[0];summary.innerHTML=`<div class="card"><div class="title">${esc(c.crop)} 현재 월 작업</div><div>${(c.currentMonthTasks||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div><p class="sub">${esc(c.relatedWeather||'관련 농업날씨를 함께 확인하세요.')}</p></div>`;detail.innerHTML=`<article class="card"><div class="title">${esc(c.crop)} 월별 작업</div>${(c.months||[]).map(m=>`<div class="month"><div class="month-head">${esc(monthLabel(m.month))}</div><div class="tasks">${(m.tasks||[]).map(t=>`<span class="task">${esc(t)}</span>`).join('')}</div></div>`).join('')}<div class="month"><div class="month-head">공식 정보 확인</div><div class="tasks">${(c.publicSources||[]).map(t=>`<span class="task">${esc(t)}</span>`).join('')}</div></div><p class="sub">${esc(c.notice||'공식 정보를 함께 확인하세요.')}</p></article>`;document.querySelector('.cta').innerHTML=`<a href="${esc(c.relatedGuide||'crop-guide.html')}">재배가이드 보기</a><a href="agri-weather.html">농업날씨 확인</a><a href="mfg.html">농자재·관리</a><a href="public-data.html">공공정보 확인</a>`}
fetch('data/crop-calendar-index.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('calendar');return r.json()}).then(d=>{data=Array.isArray(d)?d:FALLBACK;const q=new URLSearchParams(location.search).get('crop');crop.innerHTML=data.map(c=>`<option${c.crop===q?' selected':''}>${esc(c.crop)}</option>`).join('');crop.onchange=draw;draw();}).catch(()=>{data=FALLBACK;crop.innerHTML=FALLBACK.map(c=>`<option>${esc(c.crop)}</option>`).join('');crop.onchange=draw;draw();summary.insertAdjacentHTML('afterbegin','<div class="error">재배달력 정보를 불러오지 못했습니다. 기본 작물 관리 정보를 확인해주세요.</div>');});
</script>
</body>
</html>
