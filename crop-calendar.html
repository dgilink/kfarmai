*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;word-break:keep-all;line-break:strict}a{text-decoration:none;color:inherit}button,input{font:inherit}.app{max-width:480px;min-height:100dvh;margin:0 auto;background:#f5f6f8}.header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #eceef2;padding:12px 14px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand img{max-width:156px;height:auto}.home{border:1px solid #cdebdd;background:#e8f6f0;color:#157a5a;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800;white-space:nowrap}h1{font-size:21px;margin:12px 0 5px;color:#14532d}.sub{margin:0;color:#6b7280;font-size:13px;line-height:1.55}.content{padding:12px}.card{background:#fff;border:1px solid #eceef2;border-radius:8px;padding:12px;margin-bottom:10px;box-shadow:0 8px 24px rgba(17,24,39,.05)}.search{width:100%;height:40px;border:1.5px solid #dde5e0;border-radius:8px;background:#fff;padding:0 11px;font-size:14px;font-weight:700;color:#111827}.suggest-card{margin-top:8px;border:1px solid #dbe7df;background:#fbfefc;border-radius:8px;padding:7px}.hidden{display:none}.crop-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.crop-card{aspect-ratio:1/1;border:1px solid #e5e7eb;background:#fff;border-radius:8px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#1f2937;white-space:nowrap}.crop-card.active{border-color:#16a34a;background:#f0fdf4;box-shadow:0 0 0 2px rgba(22,163,74,.12)}.crop-icon{width:34px;height:34px;border-radius:999px;background:#eef8f2;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1}.crop-name{max-width:100%;font-size:12px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result-list{display:grid;gap:6px}.result-card{width:100%;border:0;background:#fff;border-radius:8px;padding:8px;text-align:left;display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center}.result-title{display:block;font-size:14px;font-weight:900}.result-meta{display:block;font-size:11.5px;color:#6b7280;margin-top:2px}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;background:#ecfdf5;color:#166534;font-size:10px;font-weight:900;white-space:nowrap}#detail{scroll-margin-top:116px}.detail-head{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center}.detail-head .crop-icon{width:44px;height:44px;font-size:24px}.section-title{font-size:16px;font-weight:950;margin:0 0 8px}.item{border:1px solid #e5e7eb;background:#f8fafc;border-radius:8px;padding:10px;margin-top:8px}.item b{font-size:13px}.item ul{margin:7px 0 0 18px;padding:0;color:#4b5563;font-size:12.5px;line-height:1.6}.month-grid{display:grid;gap:7px;margin-top:8px}.month{border:1px solid #e5e7eb;background:#fff;border-radius:8px;padding:9px}.month.active{border-color:#bbf7d0;background:#f0fdf4}.month b{display:block;font-size:12.5px;margin-bottom:4px;color:#14532d}.month p{margin:0;color:#4b5563;font-size:12.5px;line-height:1.55}.image-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-top:8px}.official-image{min-width:148px;max-width:180px}.official-image img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid #e5e7eb;background:#f8fafc}.representative-image,.stage-image{margin-top:10px}.representative-image img,.stage-image img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid #dbe7df;background:#f8fafc}.stage-image img{object-position:center;background:#f8fafc;max-height:260px;display:block}.ai-image-caption{margin:5px 0 0;color:#64748b;font-size:11.5px;line-height:1.45}.source{margin-top:4px;color:#64748b;font-size:10.5px;line-height:1.35}.source a{color:#157a5a;text-decoration:underline;overflow-wrap:anywhere}.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.links a{min-height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;background:#e8f6f0;color:#157a5a;border:1px solid #cdebdd;font-size:12px;font-weight:850;white-space:nowrap}.links a.dark{background:#111827;color:#fff;border-color:#111827}.note,.photo-note{color:#64748b;font-size:12px;line-height:1.55}.safe{background:#fff8e1;border-color:#fde68a;color:#5d4400;font-size:12px;line-height:1.6;font-weight:750}.empty{border:1px dashed #cbd5e1;background:#fff;border-radius:8px;padding:13px;color:#475569;font-size:13px;line-height:1.6}.url,.source a{word-break:break-all;overflow-wrap:anywhere}@media(max-width:340px){.crop-grid{gap:6px}.crop-name{font-size:11px}.crop-icon{width:30px;height:30px;font-size:20px}}

.context-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.context-controls label{display:grid;gap:5px;font-size:11.5px;color:#64748b;font-weight:800}.context-controls select{width:100%;height:38px;border:1.5px solid #dbe7df;border-radius:8px;background:#fff;padding:0 9px;color:#111827;font-size:13px;font-weight:800}.context-card{border:1px solid #bbf7d0;background:#f0fdf4;border-radius:8px;padding:10px;margin-top:8px}.context-card b{display:block;color:#14532d;font-size:13px}.context-card p{margin:5px 0 2px;font-size:13px;font-weight:900;color:#17202a}.context-card span,.context-card small{display:block;color:#4b5563;font-size:12px;line-height:1.45}.context-item ul{margin-top:7px}.this-month .mini strong{color:#166534}@media(max-width:360px){.context-controls{grid-template-columns:1fr}}
</style>
<style>

<body>
<main class="app">
  <header class="header">
    <div class="top"><a class="brand" href="index.html"><img src="/static/kfarmai-logo-horizontal.png" alt="kFarmAI"></a><a class="home" href="index.html">홈</a></div>
    <h1>작물별 재배달력</h1>
    <p class="sub">작물을 선택하면 월별 주요 작업과 파종·정식·수확 시기를 참고자료로 확인합니다.</p>
  </header>
  <section class="content">
    <div class="card"><input id="searchInput" class="search" type="search" placeholder="작물 또는 식물 검색"><div class="suggest-card hidden" id="resultSection"><div id="resultList" class="result-list"></div></div></div>
    <section class="card"><div id="cropGrid" class="crop-grid"></div></section>
    <section id="detail"><div class="empty">작물을 선택하면 월별 재배달력이 표시됩니다.</div></section>
  </section>
</main>
<script src="static/crop-pages.js?v=20260706-regional3"></script>
<script>
'use strict';
const {core,all,matchesCrop,regionOptions,computeRegionalContext}=window.KFARM_CROP_PAGE_DATA;
const $=id=>document.getElementById(id);
let selectedId='';
function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function escAttr(v){return esc(v).replace(/`/g,'&#96;')}
function icon(crop){return `<div class="crop-icon" aria-hidden="true">${esc(crop.icon||'🌱')}</div>`}
function renderGrid(){ $('cropGrid').innerHTML=core.map(c=>`<button class="crop-card ${c.id===selectedId?'active':''}" type="button" data-id="${escAttr(c.id)}">${icon(c)}<span class="crop-name">${esc(c.name)}</span></button>`).join(''); bindCropButtons(); }
function renderResults(q){const rows=q?all.filter(c=>matchesCrop(c,q)).slice(0,30):[];$('resultSection').classList.toggle('hidden',!q);$('resultList').innerHTML=rows.length?rows.map(c=>`<button class="result-card" type="button" data-id="${escAttr(c.id)}">${icon(c)}<span><span class="result-title">${esc(c.name)}</span><span class="result-meta">${esc(c.category)} · ${c.type==='core'?'상세 달력':'기본 정보'}</span></span><span class="badge">${c.type==='core'?'상세':'기본 정보'}</span></button>`).join(''):'<div class="empty">검색 결과가 없습니다. 다른 작물명으로 입력해보세요.</div>'; bindCropButtons(); }
function bindCropButtons(){document.querySelectorAll('[data-id]').forEach(btn=>btn.onclick=()=>selectCrop(btn.dataset.id,true))}
function list(items){return `<ul>${(items||[]).map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`}
function representativeImage(crop){const img=crop.representativeImage;if(!img||!img.url)return '';return `<figure class="representative-image"><img src="${escAttr(img.url)}" alt="${escAttr(img.alt||`${crop.name} 재배 대표 참고 이미지`)}" loading="lazy" onerror="this.closest('figure').remove()"><figcaption class="ai-image-caption">AI로 생성한 참고 이미지입니다. ${esc(img.note||'실제 품종, 생육상태, 재배환경은 다를 수 있습니다.')}</figcaption></figure>`}
function growthStageImage(crop){const steps=(crop.growthStageImages||[]).filter(img=>img&&img.url);if(steps.length)return `<div class="stage-step-grid">${steps.map(img=>`<figure class="stage-step-image"><img src="${escAttr(img.url)}" alt="${escAttr(img.alt||`${crop.name} ${img.stage||''} \uCC38\uACE0 \uC774\uBBF8\uC9C0`)}" loading="lazy" onerror="this.closest('figure').remove()"><figcaption>${esc(img.stage||'\uC0DD\uC721\uB2E8\uACC4')}</figcaption></figure>`).join('')}</div><p class="ai-image-caption">\u0041\u0049\uB85C \uC0DD\uC131\uD55C \uCC38\uACE0 \uC774\uBBF8\uC9C0\uC785\uB2C8\uB2E4. \uC2E4\uC81C \uD488\uC885, \uC0DD\uC721\uC0C1\uD0DC, \uC7AC\uBC30\uD658\uACBD\uC740 \uB2E4\uB97C \uC218 \uC788\uC2B5\uB2C8\uB2E4.</p>`;const img=crop.growthStageImage||crop.growthStageGroupImage;if(!img||!img.url)return '';return `<figure class="stage-image"><img src="${escAttr(img.url)}" alt="${escAttr(img.alt||`${crop.name} \uC0DD\uC721\uB2E8\uACC4 \uCC38\uACE0 \uC774\uBBF8\uC9C0`)}" loading="lazy" onerror="this.closest('figure').remove()"><figcaption class="ai-image-caption">${esc(img.caption||'\u0041\u0049\uB85C \uC0DD\uC131\uD55C \uC0DD\uC721\uB2E8\uACC4 \uCC38\uACE0 \uC774\uBBF8\uC9C0\uC785\uB2C8\uB2E4.')} ${esc(img.note||'\uC2E4\uC81C \uD488\uC885, \uC0DD\uC721\uC0C1\uD0DC, \uC7AC\uBC30\uD658\uACBD\uC740 \uB2E4\uB97C \uC218 \uC788\uC2B5\uB2C8\uB2E4.')}</figcaption></figure>`}
function sourceText(img){return [img.sourceName,img.licenseType].filter(Boolean).join(' · ')}
function officialImages(crop){const verified=(crop.officialImages||[]).filter(img=>img.usageStatus==='verified'&&img.url&&img.sourceName&&img.licenseType);if(!verified.length)return '<p class="photo-note">공식 사진 자료는 출처 확인 후 순차 반영 예정입니다.</p>';return `<div class="image-strip">${verified.map(img=>`<figure class="official-image"><img src="${escAttr(img.url)}" alt="${escAttr(img.caption||img.title||crop.name)}" loading="lazy" onerror="this.closest('figure').remove()"><figcaption class="source">${esc(img.caption||img.title||'공식 이미지')}<br>출처: ${img.sourceUrl?`<a href="${escAttr(img.sourceUrl)}" target="_blank" rel="noopener">${esc(sourceText(img))}</a>`:esc(sourceText(img))}</figcaption></figure>`).join('')}</div>`}
function allMonths(crop){const map=new Map((crop.monthlyCalendar||[]).map(item=>[String(item.month).replace('월',''),item]));return Array.from({length:12},(_,i)=>{const key=String(i+1);return map.get(key)||map.get(`${key}월`)||{month:`${key}월`,task:'지역·작형에 따라 다름'};});}
function publicDataStatusLabel(status){return {active:'\uC5F0\uB3D9 \uAC00\uB2A5',fallback:'fallback \uD655\uC778',pending:'\uC5F0\uB3D9 \uC608\uC815'}[status]||'\uD655\uC778 \uC608\uC815'}
function publicDataBlock(crop){
  const rows=(crop.publicDataConnections||[]).filter(Boolean);
  if(!rows.length)return '<div class="item"><b>\uACF5\uACF5\uB370\uC774\uD130 \uCC38\uACE0</b><p class="note">\uACF5\uC2DD\uC790\uB8CC\uC640 \uACF5\uACF5\uB370\uC774\uD130\uB294 \uCD9C\uCC98 \uD655\uC778 \uD6C4 \uC21C\uCC28 \uBCF4\uAC15 \uC608\uC815\uC785\uB2C8\uB2E4.</p></div>';
  return '<div class="item"><b>\uACF5\uACF5\uB370\uC774\uD130 \uCC38\uACE0</b><div class="mini-list">'+rows.map(row=>'<div class="mini"><strong>'+esc(row.label||'\uACF5\uACF5\uB370\uC774\uD130')+' &middot; '+esc(publicDataStatusLabel(row.status))+'</strong><p>'+esc([row.source,row.note].filter(Boolean).join(' / '))+'</p></div>').join('')+'</div></div>';
}
let selectedRegion=localStorage.getItem('kfarmaiCropRegion')||'';
let selectedCultivation=localStorage.getItem('kfarmaiCropCultivation')||'';
const compactRegionOptions=[
  {value:'',label:'전국 공통'},
  {value:'gyeonggi',label:'수도권·중부'},
  {value:'gangwon',label:'강원·고랭지'},
  {value:'chungnam',label:'충청권'},
  {value:'jeonnam',label:'전북·전남'},
  {value:'gyeongnam',label:'경북·경남'},
  {value:'jeju',label:'제주·도서'}
];
if(!compactRegionOptions.some(item=>item.value===selectedRegion))selectedRegion='';
const cultivationLabels={openField:'노지·텃밭',garden:'노지·텃밭',greenhouse:'시설재배',orchard:'과수원',smartFarm:'스마트팜'};
function currentContext(crop){return computeRegionalContext(crop,selectedRegion,selectedCultivation)}
function compactCultivationOptions(crop){
  const rows=crop.availableCultivationTypes||[];
  const has=value=>rows.some(item=>item.value===value);
  const out=[];
  if(has('openField')||has('garden'))out.push({value:has('openField')?'openField':'garden',label:'노지·텃밭'});
  if(has('greenhouse'))out.push({value:'greenhouse',label:'시설재배'});
  if(has('orchard'))out.push({value:'orchard',label:'과수원'});
  if(has('smartFarm'))out.push({value:'smartFarm',label:'스마트팜'});
  return out.length?out:rows.map(item=>({value:item.value,label:cultivationLabels[item.value]||item.label}));
}
function renderRegionalControls(crop){
  const ctx=currentContext(crop);
  const regionSelect='<label><span>\uC9C0\uC5ED</span><select id=\"regionSelect\" onchange=\"onRegionalChange()\">'+compactRegionOptions.map(item=>'<option value=\"'+escAttr(item.value)+'\" '+(item.value===ctx.region.value?'selected':'')+'>'+esc(item.label)+'</option>').join('')+'</select></label>';
  const typeRows=compactCultivationOptions(crop);
  const typeSelect='<label><span>\uC7AC\uBC30\uC720\uD615</span><select id=\"cultivationSelect\" onchange=\"onRegionalChange()\">'+typeRows.map(item=>'<option value=\"'+escAttr(item.value)+'\" '+(item.value===ctx.cultivation.value?'selected':'')+'>'+esc(item.label)+'</option>').join('')+'</select></label>';
  return '<div class=\"context-controls\">'+regionSelect+typeSelect+'</div>'+selectedBasisBlock(crop,ctx);
}
function selectedBasisBlock(crop,ctx){return '<section class=\"context-card\"><b>\uC120\uD0DD \uAE30\uC900</b><p>'+esc([crop.name,ctx.region.label,ctx.cultivation.label].filter(Boolean).join(' / '))+'</p><span>'+esc(ctx.groupLabel)+' \uAE30\uC900 \uCC38\uACE0\uC815\uBCF4\uC785\uB2C8\uB2E4.</span><small>'+esc(ctx.shiftNote)+'</small></section>'}
function contextList(title,items){const rows=(items||[]).filter(Boolean);if(!rows.length)return '';return '<div class=\"item context-item\"><b>'+title+'</b><ul>'+rows.map(item=>'<li>'+esc(item)+'</li>').join('')+'</ul></div>'}
function thisMonthBlock(crop){const ctx=currentContext(crop);const current=ctx.currentMonth;const next=ctx.nextMonth;const tasks=current?(current.tasks&&current.tasks.length?current.tasks:[current.task]):['\uC774\uBC88 \uB2EC\uC740 \uC791\uD615\uC5D0 \uB530\uB77C \uC791\uC5C5\uC774 \uC801\uC744 \uC218 \uC788\uC2B5\uB2C8\uB2E4.'];const weather=(ctx.weatherTasks||[]).slice(0,4);const nextText=next?(next.task||''):'\uB2E4\uC74C \uB2EC \uC791\uC5C5\uC740 \uC791\uD615\uC5D0 \uB530\uB77C \uB2EC\uB77C\uC9C8 \uC218 \uC788\uC2B5\uB2C8\uB2E4.';return '<div class=\"item this-month\"><b>\uC774\uBC88 \uB2EC \uD560 \uC77C</b><div class=\"mini-list\"><div class=\"mini\"><strong>'+esc((ctx.monthNumber||'')+'\uC6D4 \uC8FC\uC694 \uC791\uC5C5')+'</strong><p>'+esc(tasks.join(' '))+'</p></div><div class=\"mini\"><strong>\uC774\uBC88 \uB2EC \uB0A0\uC528 \uCCB4\uD06C</strong><p>'+esc(weather.join(' / '))+'</p></div><div class=\"mini\"><strong>\uB2E4\uC74C \uB2EC \uC900\uBE44</strong><p>'+esc(nextText)+'</p></div></div></div>'}
function regionalPointBlock(crop){const ctx=currentContext(crop);return contextList('\uC120\uD0DD \uC9C0\uC5ED \uAD00\uB9AC \uD3EC\uC778\uD2B8',ctx.regionPoints.concat(ctx.cultivationPoints||[]).concat([ctx.cultivationNote]))}
function extensionBlock(crop){const ctx=currentContext(crop);const text=ctx.extensionSource?ctx.extensionSource.note:'\uC9C0\uC5ED\uBCC4 \uC7AC\uBC30\uC2DC\uAE30\uC640 \uAD00\uB9AC \uBC29\uBC95\uC740 \uC2DC\uAD70 \uB18D\uC5C5\uAE30\uC220\uC13C\uD130 \uC790\uB8CC\uC640 \uB2E4\uB97C \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uC120\uD0DD\uD55C \uC9C0\uC5ED\uC758 \uB18D\uC5C5\uAE30\uC220\uC13C\uD130 \uC790\uB8CC\uB294 \uC21C\uCC28\uC801\uC73C\uB85C \uC5F0\uACB0 \uC608\uC815\uC785\uB2C8\uB2E4.';return '<div class=\"item\"><b>\uC9C0\uC5ED \uB18D\uC5C5\uAE30\uC220\uC13C\uD130 \uD655\uC778</b><p class=\"note\">'+esc(text)+'</p></div>'}
function onRegionalChange(){const region=document.getElementById('regionSelect')?.value||'';const cultivation=document.getElementById('cultivationSelect')?.value||'';const y=window.scrollY;selectedRegion=region;selectedCultivation=cultivation;localStorage.setItem('kfarmaiCropRegion',region);localStorage.setItem('kfarmaiCropCultivation',cultivation);if(selectedId){const crop=all.find(c=>c.id===selectedId);if(crop)$('detail').innerHTML=crop.type==='core'?detailCore(crop):detailBasic(crop);window.scrollTo({top:y,behavior:'auto'});}}
function detailCore(crop){const months=allMonths(crop);return `<article class="card"><div class="detail-head">${icon(crop)}<div><h2 class="section-title">${esc(crop.name)}</h2><p class="sub">${esc(crop.summary)}</p></div></div>${representativeImage(crop)}${renderRegionalControls(crop)}${officialImages(crop)}${thisMonthBlock(crop)}<div class="item"><b>파종/정식/수확 요약</b>${list([`파종: ${crop.season?.sowing||'지역·작형에 따라 다름'}`,`정식: ${crop.season?.transplant||'지역·작형에 따라 다름'}`,`수확: ${crop.season?.harvest||'지역·작형에 따라 다름'}`,crop.season?.note])}</div><div class="item"><b>월별 작업 달력</b><div class="month-grid">${months.map(m=>`<div class="month ${m.task==='지역·작형에 따라 다름'?'':'active'}"><b>${esc(m.month)}</b><p>${esc(m.task)}</p></div>`).join('')}</div></div><div class="item"><b>생육단계 참고 이미지</b>${growthStageImage(crop)}</div><div class="item"><b>재배유형별 차이</b>${list(crop.growingTypes)}</div><div class="item"><b>날씨 체크포인트</b>${list(crop.weatherCheckpoints)}</div>${regionalPointBlock(crop)}${extensionBlock(crop)}${publicDataBlock(crop)}<section class="card safe">재배달력은 지역, 품종, 시설 여부와 기상 조건에 따라 달라질 수 있는 참고자료입니다.</section><div class="links"><a class="dark" href="crop-guide.html?crop=${encodeURIComponent(crop.id)}">재배가이드 보기</a><a href="agri-weather.html">농업날씨 확인</a><a href="public-data.html">공공정보 확인</a><a href="diagnosis.html?crop=${encodeURIComponent(crop.name)}">AI 참고 진단</a></div></article>`}
function detailBasic(crop){return `<article class="card"><div class="detail-head">${icon(crop)}<div><h2 class="section-title">${esc(crop.name)}</h2><p class="sub">${esc(crop.summary)}</p><span class="badge">기본 정보</span></div></div>${officialImages(crop)}<div class="item"><b>달력 정보</b>${list(['현재 이 작물은 상세 월별 달력을 제공하지 않습니다.','재배 시기와 관리 방법은 지역, 품종, 시설 여부에 따라 달라질 수 있습니다.','공공기관 재배자료와 지역별 재배달력은 순차적으로 보강 예정입니다.'])}</div>${publicDataBlock(crop)}<div class="links"><a class="dark" href="crop-guide.html?crop=${encodeURIComponent(crop.id)}">재배가이드 보기</a><a href="public-data.html">공공정보 확인</a></div></article>`}
function clearSearch(){ $('searchInput').value=''; renderResults(''); }
function selectCrop(id, updateUrl){const crop=all.find(c=>c.id===id||c.name===id);if(!crop)return;selectedId=crop.id;clearSearch();renderGrid();$('detail').innerHTML=crop.type==='core'?detailCore(crop):detailBasic(crop);if(updateUrl)history.pushState({crop:crop.id},'',`?crop=${encodeURIComponent(crop.id)}`);setTimeout(()=>{const detail=$('detail');const y=detail.getBoundingClientRect().top+window.scrollY-118;window.scrollTo({top:Math.max(0,y),behavior:'smooth'});},0);}
function clearActiveCrop(){if(selectedId){selectedId='';renderGrid();}}
function init(){renderGrid();$('searchInput').addEventListener('focus',clearActiveCrop);$('searchInput').addEventListener('input',e=>renderResults(e.target.value));const q=new URLSearchParams(location.search).get('crop');if(q)selectCrop(decodeURIComponent(q),false);window.addEventListener('popstate',()=>{const q=new URLSearchParams(location.search).get('crop');selectedId='';renderGrid();if(q)selectCrop(decodeURIComponent(q),false);});}
init();
</script>
</body>
