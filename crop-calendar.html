<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>작물별 재배달력 - kFarmAI</title>
<link rel="icon" href="/static/kfarmai-logo-horizontal.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}a{text-decoration:none;color:inherit}button,input{font:inherit}.app{max-width:480px;min-height:100dvh;margin:0 auto;background:#f5f6f8}.header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #eceef2;padding:12px 14px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand img{max-width:170px;height:auto}.home{border:1px solid #cdebdd;background:#e8f6f0;color:#157a5a;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800}h1{font-size:21px;margin:12px 0 5px}.sub{margin:0;color:#6b7280;font-size:13px;line-height:1.55}.content{padding:12px 12px 88px}.card{background:#fff;border:1px solid #eceef2;border-radius:8px;padding:12px;margin-bottom:10px;box-shadow:0 8px 24px rgba(17,24,39,.05)}.search{width:100%;height:40px;border:1.5px solid #dde5e0;border-radius:8px;background:#fff;padding:0 11px;font-size:14px;font-weight:700;color:#111827}.crop-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.crop-card{aspect-ratio:1/1;border:1px solid #e5e7eb;background:#fff;border-radius:8px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#1f2937}.crop-card.active{border-color:#16a34a;background:#f0fdf4;box-shadow:0 0 0 2px rgba(22,163,74,.12)}.crop-icon{width:34px;height:34px;border-radius:999px;background:#eef8f2;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1}.crop-name{max-width:100%;font-size:12px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result-list{display:grid;gap:8px}.result-card{width:100%;border:1px solid #e5e7eb;background:#fff;border-radius:8px;padding:10px;text-align:left;display:grid;grid-template-columns:36px 1fr auto;gap:9px;align-items:center}.result-card .crop-icon{width:34px;height:34px}.result-title{font-size:14px;font-weight:900}.result-meta{font-size:11.5px;color:#6b7280;margin-top:2px}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;background:#ecfdf5;color:#166534;font-size:10px;font-weight:900}.detail-head{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center}.detail-head .crop-icon{width:44px;height:44px;font-size:24px}.section-title{font-size:16px;font-weight:950;margin:0 0 8px}.month{border:1px solid #e5e7eb;background:#f8fafc;border-radius:8px;padding:10px;margin-top:8px}.month b{display:block;font-size:13px;margin-bottom:4px}.month p{margin:0;color:#4b5563;font-size:12.5px;line-height:1.55}.item{border:1px solid #e5e7eb;background:#f8fafc;border-radius:8px;padding:10px;margin-top:8px}.item b{font-size:13px}.item ul{margin:7px 0 0 18px;padding:0;color:#4b5563;font-size:12.5px;line-height:1.6}.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.links a{min-height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;background:#e8f6f0;color:#157a5a;border:1px solid #cdebdd;font-size:12px;font-weight:850}.links a.dark{background:#111827;color:#fff;border-color:#111827}.note{color:#64748b;font-size:12px;line-height:1.55}.safe{background:#fff8e1;border-color:#fde68a;color:#5d4400;font-size:12px;line-height:1.6;font-weight:750}.empty{border:1px dashed #cbd5e1;background:#fff;border-radius:8px;padding:13px;color:#475569;font-size:13px;line-height:1.6}.photo-note{font-size:11.5px;color:#64748b;margin-top:7px}.hidden{display:none}@media (max-width:340px){.crop-grid{gap:6px}.crop-name{font-size:11px}.crop-icon{width:30px;height:30px;font-size:20px}}
</style>
</head>
<body>
<main class="app">
  <header class="header">
    <div class="top"><a class="brand" href="index.html"><img src="/static/kfarmai-logo-horizontal.png" alt="kFarmAI"></a><a class="home" href="index.html">홈</a></div>
    <h1>작물별 재배달력</h1>
    <p class="sub">작물을 선택하면 월별 작업 흐름만 확인합니다. 재배가이드는 별도 화면에서 봅니다.</p>
  </header>
  <section class="content">
    <div class="card"><input id="searchInput" class="search" type="search" placeholder="작물 또는 식물 검색"></div>
    <section class="card" id="coreSection"><div id="cropGrid" class="crop-grid"></div></section>
    <section class="card hidden" id="resultSection"><div id="resultList" class="result-list"></div></section>
    <section id="detail"><div class="empty">작물을 선택하면 월별 주요 작업과 시기 참고 정보가 표시됩니다.</div></section>
  </section>
</main>
<script src="static/crop-pages.js"></script>
<script>
'use strict';
const {core,all,calendarByCategory,matchesCrop}=window.KFARM_CROP_PAGE_DATA;
const $=id=>document.getElementById(id);
let selectedId='';
function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function norm(v){return String(v||'').toLowerCase().replace(/\s+/g,'')}
function icon(crop){return `<div class="crop-icon" aria-hidden="true">${esc(crop.icon||'🌿')}</div>`}
function renderGrid(){ $('cropGrid').innerHTML=core.map(c=>`<button class="crop-card ${c.id===selectedId?'active':''}" type="button" data-id="${esc(c.id)}">${icon(c)}<span class="crop-name">${esc(c.name)}</span></button>`).join(''); bindCropButtons(); }
function renderResults(q){const rows=q?all.filter(c=>matchesCrop(c,q)).slice(0,30):[];$('resultSection').classList.toggle('hidden',!q);$('resultList').innerHTML=rows.length?rows.map(c=>`<button class="result-card" type="button" data-id="${esc(c.id)}">${icon(c)}<span><span class="result-title">${esc(c.name)}</span><span class="result-meta">${esc(c.category)} · ${c.type==='core'?'상세 달력':'기본 정보'}</span></span><span class="badge">${c.type==='core'?'상세':'기본 정보'}</span></button>`).join(''):'<div class="empty">검색 결과가 없습니다. 다른 작물명으로 입력해보세요.</div>'; bindCropButtons(); }
function bindCropButtons(){document.querySelectorAll('[data-id]').forEach(btn=>btn.onclick=()=>selectCrop(btn.dataset.id,true))}
function detailCore(crop){const months=calendarByCategory[crop.category]||calendarByCategory["과채류"];return `<article class="card"><div class="detail-head">${icon(crop)}<div><h2 class="section-title">${esc(crop.name)}</h2><p class="sub">${esc(crop.summary)}</p><div class="photo-note">공식 사진 자료는 출처 확인 후 순차 반영 예정입니다.</div></div></div><div class="item"><b>월별 주요 작업</b>${months.map(m=>`<div class="month"><b>${esc(m.range)}</b><p>${esc(m.task)}</p></div>`).join('')}</div><div class="item"><b>파종/정식/수확 시기</b><ul><li>지역, 품종, 시설 여부에 따라 시기가 달라질 수 있습니다.</li><li>공식 재배자료와 지역 농업기술센터 자료를 함께 확인해야 합니다.</li></ul></div><div class="item"><b>재배유형별 차이</b><ul><li>노지: 강수, 고온, 풍속 영향을 함께 확인합니다.</li><li>시설: 환기, 습도, 관수 간격을 함께 확인합니다.</li><li>베란다/텃밭: 용기 배수와 일조 조건을 함께 확인합니다.</li></ul></div><section class="card safe">재배달력은 지역, 품종, 시설 여부와 기상 조건에 따라 달라질 수 있는 참고자료입니다.</section><div class="links"><a class="dark" href="crop-guide.html?crop=${encodeURIComponent(crop.id)}">재배가이드 보기</a><a href="agri-weather.html">농업날씨 확인</a><a href="public-data.html">공공정보 확인</a><a href="diagnosis.html?crop=${encodeURIComponent(crop.name)}">AI 참고 진단</a></div></article>`}
function detailBasic(crop){return `<article class="card"><div class="detail-head">${icon(crop)}<div><h2 class="section-title">${esc(crop.name)}</h2><p class="sub">${esc(crop.summary)}</p><span class="badge">기본 정보</span></div></div><div class="item"><b>달력 정보</b><ul><li>현재 이 작물은 상세 월별 달력을 제공하지 않습니다.</li><li>재배 시기와 관리 방법은 지역, 품종, 시설 여부에 따라 달라질 수 있습니다.</li><li>공공기관 재배자료와 지역별 재배달력은 순차적으로 보강 예정입니다.</li></ul></div><p class="photo-note">공식 사진 자료는 출처 확인 후 순차 반영 예정입니다.</p><div class="links"><a class="dark" href="crop-guide.html?crop=${encodeURIComponent(crop.id)}">재배가이드 보기</a><a href="public-data.html">공공정보 확인</a></div></article>`}
function clearSearch(){ $('searchInput').value=''; renderResults(''); }
function selectCrop(id, updateUrl){const crop=all.find(c=>c.id===id||c.name===id);if(!crop)return;selectedId=crop.id;clearSearch();renderGrid();$('detail').innerHTML=crop.type==='core'?detailCore(crop):detailBasic(crop);if(updateUrl)history.pushState({crop:crop.id},'',`?crop=${encodeURIComponent(crop.id)}`);}
function init(){renderGrid();$('searchInput').addEventListener('input',e=>renderResults(e.target.value));const q=new URLSearchParams(location.search).get('crop');if(q)selectCrop(decodeURIComponent(q),false);window.addEventListener('popstate',()=>{const q=new URLSearchParams(location.search).get('crop');selectedId='';renderGrid();if(q)selectCrop(decodeURIComponent(q),false);});}
init();
</script>
</body>
</html>
