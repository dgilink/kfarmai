<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>작물별 재배가이드 - kFarmAI</title>
<link rel="icon" href="/static/kfarmai-logo-horizontal.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}a{text-decoration:none;color:inherit}button,input{font:inherit}.app{max-width:480px;min-height:100dvh;margin:0 auto;background:#f5f6f8}.header{background:#fff;border-bottom:1px solid #eceef2;padding:12px 14px}.top{display:flex;align-items:center;justify-content:space-between}.brand img{max-width:170px}.home{border:1px solid #cdebdd;background:#e8f6f0;color:#157a5a;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:900}h1{font-size:22px;margin:12px 0 6px}.sub{margin:0;color:#6b7280;font-size:13px;line-height:1.55}.content{padding:14px 14px 88px}.card{background:#fff;border:1px solid #eceef2;border-radius:8px;padding:14px;margin-bottom:10px;box-shadow:0 8px 24px rgba(17,24,39,.05)}.search{width:100%;height:43px;border:1.5px solid #dde5e0;border-radius:8px;background:#fff;padding:0 12px;font-weight:800}.title{font-size:17px;font-weight:950;margin:0 0 8px}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:11px;font-weight:900;margin:0 5px 5px 0}.item{border:1px solid #e5e7eb;background:#f8fafc;border-radius:8px;padding:11px;margin-top:8px}.item b{font-size:13px}.item ul{margin:7px 0 0 18px;padding:0;color:#4b5563;font-size:12.5px;line-height:1.6}.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.links a{min-height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;background:#e8f6f0;color:#157a5a;border:1px solid #cdebdd;font-size:12px;font-weight:900}.links a.dark{background:#111827;color:#fff;border-color:#111827}.source{display:inline-flex;margin-top:8px;padding:5px 8px;border-radius:999px;background:#ecfdf5;color:#166534;font-size:11px;font-weight:900}.safe{background:#fff8e1;border-color:#fde68a;color:#5d4400;font-size:12px;line-height:1.6;font-weight:800}.empty{border:1px dashed #cbd5e1;background:#fff;border-radius:8px;padding:14px;color:#475569;font-size:13px;line-height:1.6}
</style>
</head>
<body>
<main class="app">
  <header class="header">
    <div class="top"><a class="brand" href="index.html"><img src="/static/kfarmai-logo-horizontal.png" alt="kFarmAI"></a><a class="home" href="index.html">홈</a></div>
    <h1>작물별 재배가이드</h1>
    <p class="sub">농민과 텃밭 사용자가 바로 확인할 수 있도록 관리 포인트를 짧게 정리했습니다.</p>
  </header>
  <section class="content">
    <div class="card"><input id="searchInput" class="search" type="search" placeholder="작물명, 별칭, 초성 검색"></div>
    <div id="list"></div>
  </section>
</main>
<script>
'use strict';
const APPROVED='approved';
const $=id=>document.getElementById(id);
let data=null,query='';
function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function norm(v){return String(v||'').toLowerCase().replace(/\s+/g,'')}
function approved(rows){return (rows||[]).filter(row=>row.status===APPROVED)}
function sourceBadge(name){return `<span class="source">출처: ${esc(name)}</span>`}
function match(crop){const q=norm(query);if(!q)return true;return [crop.name_ko,crop.name_en,crop.chosung,...(crop.aliases||[])].some(v=>norm(v).includes(q))}
function rows(cropId){return approved(data.crop_calendar).filter(r=>r.crop_id===cropId).slice(0,6)}
function pests(cropId){return approved(data.pest_disease_items).filter(r=>r.crop_id===cropId).slice(0,5)}
function renderGuide(crop){const tasks=rows(crop.id);const pestRows=pests(crop.id);return `<article class="card"><h2 class="title">${esc(crop.name_ko)} 재배가이드</h2><span class="badge">${esc(crop.priority_grade)}등급</span><span class="badge">${esc(crop.chosung)}</span><p class="sub">${esc(crop.description_short)}</p><div class="item"><b>이번에 확인할 관리 포인트</b><ul>${tasks.map(t=>`<li>${esc(t.task_description)}</li>`).join('')}</ul></div><div class="item"><b>이상증상/병해충 확인</b><ul>${pestRows.map(p=>`<li>${esc(p.name_ko)}: ${esc(p.prevention)}</li>`).join('')}</ul></div><div class="item"><b>공식 사진</b><ul><li>검수 승인된 공식 사진만 표시합니다.</li><li>현재 공식 이미지 매핑은 준비 중입니다.</li></ul></div>${sourceBadge('농촌진흥청 농사로')} ${sourceBadge('국가농작물병해충관리시스템 NCPMS')}<div class="links"><a class="dark" href="crop-calendar.html?crop=${encodeURIComponent(crop.name_ko)}">재배달력 보기</a><a href="diagnosis.html?crop=${encodeURIComponent(crop.name_ko)}">AI 참고 진단</a><a href="agri-weather.html">농업날씨 확인</a><a href="public-data.html">공공정보 확인</a></div></article>`}
function render(){const crops=approved(data.crops).filter(match).sort((a,b)=>a.display_order-b.display_order);$('list').innerHTML=crops.length?crops.map(renderGuide).join(''):'<div class="empty">공식 데이터 준비 중입니다. 다른 작물명이나 초성으로 다시 검색해보세요.</div>'}
function init(json){data=json;const q=new URLSearchParams(location.search).get('crop');if(q)$('searchInput').value=q,query=q;$('searchInput').oninput=e=>{query=e.target.value;render()};render()}
fetch('data/crops_mvp.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('crops');return r.json()}).then(init).catch(()=>{$('list').innerHTML='<div class="empty">재배가이드 데이터를 불러오지 못했습니다. 잠시 후 다시 확인하거나 공식 공공데이터 제공처를 확인해주세요.</div>'});
</script>
</body>
</html>
