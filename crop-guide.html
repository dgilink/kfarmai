<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>작물별 재배가이드 - kFarmAI</title>
<link rel="icon" href="/static/kfarmai-logo-horizontal.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}a{text-decoration:none;color:inherit}button,input{font:inherit}.app{max-width:480px;min-height:100dvh;margin:0 auto;background:#f5f6f8}.header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #eceef2;padding:12px 14px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand img{max-width:170px;height:auto}.home{border:1px solid #cdebdd;background:#e8f6f0;color:#157a5a;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800}h1{font-size:21px;margin:12px 0 5px}.sub{margin:0;color:#6b7280;font-size:13px;line-height:1.55}.content{padding:12px 12px 88px}.card{background:#fff;border:1px solid #eceef2;border-radius:8px;padding:12px;margin-bottom:10px;box-shadow:0 8px 24px rgba(17,24,39,.05)}.search{width:100%;height:40px;border:1.5px solid #dde5e0;border-radius:8px;background:#fff;padding:0 11px;font-size:14px;font-weight:700;color:#111827}.suggest-card{margin-top:8px;border:1px solid #dbe7df;background:#fbfefc;border-radius:8px;padding:7px}.crop-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.crop-card{aspect-ratio:1/1;border:1px solid #e5e7eb;background:#fff;border-radius:8px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#1f2937}.crop-card.active{border-color:#16a34a;background:#f0fdf4;box-shadow:0 0 0 2px rgba(22,163,74,.12)}.crop-icon{width:34px;height:34px;border-radius:999px;background:#eef8f2;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1}.crop-name{max-width:100%;font-size:12px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result-list{display:grid;gap:6px}.result-card{width:100%;border:0;background:#fff;border-radius:8px;padding:8px;text-align:left;display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center}.result-card .crop-icon{width:32px;height:32px}.result-title{font-size:14px;font-weight:900}.result-meta{font-size:11.5px;color:#6b7280;margin-top:2px}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;background:#ecfdf5;color:#166534;font-size:10px;font-weight:900}.detail-head{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center}.detail-head .crop-icon{width:44px;height:44px;font-size:24px}.section-title{font-size:16px;font-weight:950;margin:0 0 8px}.item{border:1px solid #e5e7eb;background:#f8fafc;border-radius:8px;padding:10px;margin-top:8px}.item b{font-size:13px}.item ul{margin:7px 0 0 18px;padding:0;color:#4b5563;font-size:12.5px;line-height:1.6}.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.links a{min-height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;background:#e8f6f0;color:#157a5a;border:1px solid #cdebdd;font-size:12px;font-weight:850}.links a.dark{background:#111827;color:#fff;border-color:#111827}.note{color:#64748b;font-size:12px;line-height:1.55}.safe{background:#fff8e1;border-color:#fde68a;color:#5d4400;font-size:12px;line-height:1.6;font-weight:750}.empty{border:1px dashed #cbd5e1;background:#fff;border-radius:8px;padding:13px;color:#475569;font-size:13px;line-height:1.6}.photo-note{font-size:11.5px;color:#64748b;margin-top:7px}.hidden{display:none}@media (max-width:340px){.crop-grid{gap:6px}.crop-name{font-size:11px}.crop-icon{width:30px;height:30px;font-size:20px}}
</style>
</head>
<body>
<main class="app">
  <header class="header">
    <div class="top"><a class="brand" href="index.html"><img src="/static/kfarmai-logo-horizontal.png" alt="kFarmAI"></a><a class="home" href="index.html">홈</a></div>
    <h1>작물별 재배가이드</h1>
    <p class="sub">작물을 선택하면 재배가이드만 간단히 확인합니다. 재배달력은 별도 화면에서 봅니다.</p>
  </header>
  <section class="content">
    <div class="card"><input id="searchInput" class="search" type="search" placeholder="작물 또는 식물 검색"><div class="suggest-card hidden" id="resultSection"><div id="resultList" class="result-list"></div></div></div>
    <section class="card" id="coreSection"><div id="cropGrid" class="crop-grid"></div></section>
    <section id="detail"><div class="empty">작물을 선택하면 한 줄 요약과 관리 포인트가 표시됩니다.</div></section>
  </section>
</main>
<script src="static/crop-pages.js"></script>
<script>
'use strict';
const {core,basic,all,matchesCrop}=window.KFARM_CROP_PAGE_DATA;
const $=id=>document.getElementById(id);
let selectedId='';
function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function norm(v){return String(v||'').toLowerCase().replace(/\s+/g,'')}
function icon(crop){return `<div class="crop-icon" aria-hidden="true">${esc(crop.icon||'🌿')}</div>`}
function renderGrid(){ $('cropGrid').innerHTML=core.map(c=>`<button class="crop-card ${c.id===selectedId?'active':''}" type="button" data-id="${esc(c.id)}">${icon(c)}<span class="crop-name">${esc(c.name)}</span></button>`).join(''); bindCropButtons(); }
function renderResults(q){const rows=q?all.filter(c=>matchesCrop(c,q)).slice(0,30):[];$('resultSection').classList.toggle('hidden',!q);$('resultList').innerHTML=rows.length?rows.map(c=>`<button class="result-card" type="button" data-id="${esc(c.id)}">${icon(c)}<span><span class="result-title">${esc(c.name)}</span><span class="result-meta">${esc(c.category)} · ${c.type==='core'?'상세 가이드':'기본 정보'}</span></span><span class="badge">${c.type==='core'?'상세':'기본 정보'}</span></button>`).join(''):'<div class="empty">검색 결과가 없습니다. 다른 작물명으로 입력해보세요.</div>'; bindCropButtons(); }
function bindCropButtons(){document.querySelectorAll('[data-id]').forEach(btn=>btn.onclick=()=>selectCrop(btn.dataset.id,true))}
function detailCore(crop){return `<article class="card"><div class="detail-head">${icon(crop)}<div><h2 class="section-title">${esc(crop.name)}</h2><p class="sub">${esc(crop.summary)}</p><div class="photo-note">공식 사진 자료는 출처 확인 후 순차 반영 예정입니다.</div></div></div><div class="item"><b>생육 단계</b><ul>${crop.stages.map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div><div class="item"><b>주요 관리 포인트</b><ul>${crop.managementPoints.map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div><div class="item"><b>자주 생기는 문제</b><ul>${crop.commonProblems.map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div><div class="item"><b>관련 농업날씨 체크포인트</b><ul>${crop.weatherPoints.slice(0,3).map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div><div class="item"><b>관련 농자재 종류</b><ul>${crop.materials.map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div><p class="note">공식 자료 확인 예정: 공공기관 이미지와 원문 자료는 사용 조건 확인 후 보강합니다.</p><div class="links"><a class="dark" href="crop-calendar.html?crop=${encodeURIComponent(crop.id)}">재배달력 보기</a><a href="agri-weather.html">농업날씨 확인</a><a href="public-data.html">공공정보 확인</a><a href="diagnosis.html?crop=${encodeURIComponent(crop.name)}">AI 참고 진단</a></div></article>`}
function detailBasic(crop){return `<article class="card"><div class="detail-head">${icon(crop)}<div><h2 class="section-title">${esc(crop.name)}</h2><p class="sub">${esc(crop.summary)}</p><span class="badge">기본 정보</span></div></div><div class="item"><b>기본 재배 참고</b><ul><li>재배 시기와 관리 방법은 지역, 품종, 시설 여부에 따라 달라질 수 있습니다.</li><li>현재 이 작물은 기본 정보만 제공 중입니다.</li><li>공공기관 재배자료와 지역별 재배달력은 순차적으로 보강 예정입니다.</li></ul></div><p class="photo-note">공식 사진 자료는 출처 확인 후 순차 반영 예정입니다.</p><div class="links"><a class="dark" href="crop-calendar.html?crop=${encodeURIComponent(crop.id)}">재배달력 보기</a><a href="public-data.html">공공정보 확인</a></div></article>`}
function clearSearch(){ $('searchInput').value=''; renderResults(''); }
function selectCrop(id, updateUrl){const crop=all.find(c=>c.id===id||c.name===id);if(!crop)return;selectedId=crop.id;clearSearch();renderGrid();$('detail').innerHTML=crop.type==='core'?detailCore(crop):detailBasic(crop);if(updateUrl)history.pushState({crop:crop.id},'',`?crop=${encodeURIComponent(crop.id)}`);setTimeout(()=>$('detail').scrollIntoView({behavior:'auto',block:'start'}),0);}
function init(){renderGrid();$('searchInput').addEventListener('input',e=>renderResults(e.target.value));const q=new URLSearchParams(location.search).get('crop');if(q)selectCrop(decodeURIComponent(q),false);window.addEventListener('popstate',()=>{const q=new URLSearchParams(location.search).get('crop');selectedId='';renderGrid();if(q)selectCrop(decodeURIComponent(q),false);});}
init();
</script>
</body>
</html>
