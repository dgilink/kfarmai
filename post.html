    if(!value) return [];

    if(!value) return '';

    if(min < 60) return `${min}분 전`;

async function loadPost() {

function handleEditPostImages(input){const incoming=Array.from(input.files||[]).filter(file=>file.type.startsWith('image/'));const remain=3-editExistingImages.length-editNewImages.length;if(remain<=0){showToast('사진은 최대 3장까지 첨부할 수 있습니다.');input.value='';return;}editNewImages=editNewImages.concat(incoming.slice(0,remain));input.value='';renderEditImagePreview();}

async function uploadEditPostImages(userId){const urls=[];for(let i=0;i<editNewImages.length;i++){const file=editNewImages[i];const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-zA-Z0-9]/g,'').toLowerCase()||'jpg';const path=`${userId}/${Date.now()}_edit_${i}_${Math.random().toString(36).slice(2)}.${ext}`;const {error}=await sb.storage.from('post-images').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type||'image/jpeg'});if(error)throw error;const {data}=sb.storage.from('post-images').getPublicUrl(path);if(data?.publicUrl)urls.push(data.publicUrl);}return urls;}
async function savePostEdit(){if(!currentUser?.id||!currentPost||currentUser.id!==currentPost.user_id)return showToast('권한이 없습니다.');const title=document.getElementById('editPostTitle').value.trim();const content=document.getElementById('editPostContent').value.trim();const category=document.getElementById('editPostCategory').value;if(!title||!content)return showToast('제목과 내용을 입력해주세요.');const btn=document.getElementById('editPostSubmit');btn.disabled=true;try{const addedUrls=await uploadEditPostImages(currentUser.id);const image_urls=editExistingImages.concat(addedUrls).slice(0,3);const author=extractAuthorNicknameFromContent(currentPost.content)||displayNameForRecord(currentPost);const {data,error}=await sb.from('posts').update({title,content:contentWithCategory(content,'',author),crop_tag:category||null,image_urls}).eq('id',postId).eq('user_id',currentUser.id).select('id');if(error)throw error;if(!data?.length)throw new Error('게시글 수정 권한이 없거나 이미 삭제된 글입니다.');closeEditPostModal();showToast('게시글이 수정되었습니다.');await loadPost();}catch(err){console.error('post edit failed',err);showToast(err.message||'수정에 실패했습니다. 사진 저장 권한 또는 잠시 후 다시 시도해주세요.');}finally{btn.disabled=false;}}

async function loadComments() {
  try {
    const { data, error } = await sb
      .from('comments')
      .select('*')
      .eq('post_id', postId)
      .order('created_at', { ascending:true });

    document.getElementById('commentList').innerHTML = '<div class="empty">댓글을 불러오지 못했습니다.</div>';
  }

function renderComments(comments,profileMap={}) {
  document.getElementById('commentCount').textContent = comments.length ? comments.length : '';
  const list = document.getElementById('commentList');
  if (!comments.length) { list.innerHTML = '<div class="empty">아직 댓글이 없습니다.</div>'; return; }
  commentAuthorSnapshots = {};
  list.innerHTML = comments.map(comment => {
    const isOwner = !!currentUser?.id && currentUser.id === comment.user_id;
    commentAuthorSnapshots[comment.id] = extractAuthorNicknameFromContent(comment.content) || displayNameForRecord(comment,profileMap);
    const body=stripCategoryPrefix(comment.content||'');
    return `<article class="comment" id="comment-${escAttr(comment.id)}"><div class="comment-head"><span>${esc(displayNameForRecord(comment,profileMap))}</span>${comment.is_ai ? '<span class="ai-badge">AI</span>' : ''}<span>${timeAgo(comment.created_at)}</span>${isOwner ? `<div class="comment-actions"><button class="comment-action" type="button" onclick="editComment('${escAttr(comment.id)}', '${escAttr(body)}')">수정</button><button class="comment-action delete" type="button" onclick="deleteComment('${escAttr(comment.id)}')">삭제</button></div>` : ''}</div><div class="comment-body">${esc(body)}</div></article>`;
  }).join('');

async function submitComment() {
  if(!currentUser?.id){
    showToast('로그인 후 댓글을 등록할 수 있습니다.');
    renderCommentFormState();
    return;
  }
  const content = document.getElementById('commentInput').value.trim();
  if (!content) return showToast('댓글 내용을 입력해주세요.');
  const userId = currentUser.id;
  const btn = document.getElementById('commentSubmit');
  btn.disabled = true;
  try {
    const { error } = await sb.from('comments').insert({ post_id:postId, user_id:userId, content:contentWithCategory(content,'',displayNameForUser(currentUser)), is_ai:false });
    if (error) throw error;
    document.getElementById('commentInput').value = '';
    showToast('댓글이 등록되었습니다.');

  } catch (err) {
    showToast(err.message || '댓글 등록에 실패했습니다.');

    btn.disabled = false;

function renderCommentFormState(){
  const note=document.getElementById('commentLoginNote');
  const input=document.getElementById('commentInput');
  const btn=document.getElementById('commentSubmit');

  if(note)note.textContent=loggedIn?'':'로그인 후 댓글을 등록할 수 있습니다.';
  if(input)input.disabled=!loggedIn;
  if(btn)btn.disabled=!loggedIn;

async function loadRelatedPosts() {
  if (!currentPost?.channel_id) {
    document.getElementById('relatedList').innerHTML = '<div class="empty">관련 글이 없습니다.</div>';
    return;
  }
  try {
    const { data, error } = await sb
      .from('posts')
      .select('id,title,created_at,region_tag,channels(name, slug)')
      .eq('channel_id', currentPost.channel_id)
      .neq('id', postId)
      .order('created_at', { ascending:false })
      .limit(3);
    if (error) throw error;
    renderRelatedPosts(data || []);
  } catch (err) {
    document.getElementById('relatedList').innerHTML = '<div class="empty">관련 글을 불러오지 못했습니다.</div>';
  }
}

function renderRelatedPosts(posts) {

    list.innerHTML = '<div class="empty">같은 채널의 최근 글이 없습니다.</div>';
    return;
  }
  list.innerHTML = posts.map(post => {
    const slug = post.channels?.slug || '';
    return `<a class="related-card" href="post.html?id=${encodeURIComponent(post.id)}">
      <span class="badge ${CHANNEL_BADGE_COLORS[slug] || ''}">${esc(post.channels?.name || channelName(slug))}</span>

      <div class="related-meta">${post.region_tag ? '#' + esc(post.region_tag) + ' · ' : ''}${timeAgo(post.created_at)}</div>
    </a>`;
  }).join('');
}

async function deleteComment(id){if(!confirm('정말 삭제하시겠습니까?'))return;if(!currentUser?.id)return showToast('로그인 후 댓글을 삭제할 수 있습니다.');try{const {data,error}=await sb.from('comments').delete().eq('id',id).eq('user_id',currentUser.id).select('id');if(error)throw error;if(!data?.length)throw new Error('댓글 삭제 권한이 없거나 이미 삭제된 댓글입니다.');showToast('댓글이 삭제되었습니다.');loadComments();}catch(err){showToast(err.message||'댓글 삭제에 실패했습니다.');}}

  else location.href = 'channel.html';
}

function openLoginModal() { document.getElementById('loginModal').classList.add('open'); }
function closeLoginModal() { document.getElementById('loginModal').classList.remove('open'); }
function authCallbackUrl(){return 'https://kfarmai.com/auth-callback.html';}

async function loginGoogle() {
  const { error } = await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo:authCallbackUrl() } });
  if (error) showToast('로그인 실패: ' + error.message);
}

function channelName(slug) { return CHANNEL_CONFIG[slug] || '일반'; }
function normalizeImages(value) {
  if (!value) return [];
  if (Array.isArray(value)) return value.filter(Boolean);
  if (typeof value === 'string') {
    try {
      const parsed = JSON.parse(value);
      return Array.isArray(parsed) ? parsed.filter(Boolean) : [value].filter(Boolean);
    } catch (_) {
      return value.split(',').map(v => v.trim()).filter(Boolean);
    }
  }
  return [];
}
function extractCategoryFromContent(content){
  const match=String(content||'').match(/^\[(?:대표 증상|카테고리):\s*([^\]]+)\]/m);
  return match ? match[1].trim() : '';
}
function extractAuthorNicknameFromContent(content){
  const match=String(content||'').match(/^\[(?:\uC791\uC131\uC790|[^:\]]*):\s*([^\]]+)\]/m);
  return match ? match[1].trim() : '';
}
function stripCategoryPrefix(content){
  return String(content||'').replace(/^\[(?:\uC791\uC131\uC790|\uCC44\uB110|\uC9C0\uC5ED|\uB300\uD45C\s*\uC99D\uC0C1|\uD0DC\uADF8|[^:\]]*):\s*[^\]]+\]\s*/gm,'').trim();
}
function contentWithCategory(content,category,authorName=''){
  const clean=String(content||'').trim();
  const prefix=[authorName?`[작성자: ${authorName}]`:''].filter(Boolean).join('\n');
  return prefix?`${prefix}\n\n${clean}`:clean;
}
function esc(value) {
  return String(value || '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function escAttr(value) { return esc(value).replace(/`/g, '&#96;'); }
function timeAgo(dateValue) {
  if (!dateValue) return '';
  const diff = Date.now() - new Date(dateValue).getTime();
  const min = Math.floor(diff / 60000);
  if (min < 1) return '방금';
  if (min < 60) return `${min}분 전`;
  const hour = Math.floor(min / 60);
  if (hour < 24) return `${hour}시간 전`;
  const day = Math.floor(hour / 24);
  if (day < 7) return `${day}일 전`;
  return new Date(dateValue).toLocaleDateString('ko-KR');
}
function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
}
