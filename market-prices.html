<html lang="ko">
<head>

<link rel="icon" href="/static/kfarmai-logo-horizontal.png">
<meta name="description" content="농산물 시세를 시장 흐름 참고자료로 확인합니다.">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0a0a0a;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}a{text-decoration:none;color:inherit}.app{max-width:480px;min-height:100dvh;margin:0 auto;background:#F5F6F8}.header{background:#fff;border-bottom:1px solid #ECEEF2;padding:12px 14px 14px}.top{display:flex;align-items:center;justify-content:space-between}.brand img{max-width:180px;height:auto}.home{border:1px solid #CDEBDD;background:#E8F6F0;color:#157A5A;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:900}h1{margin-top:12px;font-size:23px}.sub{margin-top:7px;color:#6B7280;font-size:13px;line-height:1.55}.content{padding:14px 14px 90px}.search-row{display:grid;grid-template-columns:1fr 74px;gap:8px;margin-bottom:10px}.search{width:100%;height:42px;border:1.5px solid #DDE5E0;border-radius:12px;padding:0 12px;background:#fff;font-weight:800}.search-btn{height:42px;border:0;border-radius:12px;background:#157A5A;color:#fff;font-size:13px;font-weight:950;cursor:pointer}.chips,.periods{display:flex;gap:7px;overflow-x:auto;padding:0 0 10px;margin-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar,.periods::-webkit-scrollbar{display:none}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:2px 0 10px}.chip,.period{flex:0 0 auto;border:1px solid #CDEBDD;background:#E8F6F0;color:#157A5A;border-radius:999px;padding:8px 10px;font-size:12px;font-weight:900;cursor:pointer}.tab{width:100%;min-height:38px;border-radius:12px;padding:8px 7px;font-size:11.5px;font-weight:950;line-height:1.2;border:1px solid var(--tab-border);background:var(--tab-bg);color:var(--tab-fg);cursor:pointer}.chip.active,.period.active{background:#157A5A;color:#fff;border-color:#157A5A}.tab.active{background:var(--tab-active);color:#fff;border-color:var(--tab-active)}.tab[data-type=retail]{--tab-bg:#E8F6F0;--tab-fg:#157A5A;--tab-border:#B7E4D1;--tab-active:#157A5A}.tab[data-type=middleman]{--tab-bg:#FFF4E6;--tab-fg:#B45309;--tab-border:#FED7AA;--tab-active:#D97706}.tab[data-type=auction]{--tab-bg:#EEF2FF;--tab-fg:#4338CA;--tab-border:#C7D2FE;--tab-active:#4F46E5}.tab[data-type=eco]{--tab-bg:#F0FDF4;--tab-fg:#15803D;--tab-border:#BBF7D0;--tab-active:#16A34A}.card{background:#fff;border:1px solid #ECEEF2;border-radius:14px;padding:12px;margin-bottom:9px;box-shadow:0 6px 18px rgba(17,24,39,.04)}.intro{padding:12px}.section-title{margin:14px 0 8px;font-size:14px;font-weight:950}.result-count{margin-left:6px;color:#64748B;font-size:12px;font-weight:800}.pill{display:inline-flex;padding:4px 7px;border-radius:999px;background:#E8F6F0;color:#157A5A;font-size:10.5px;font-weight:900}.pill.orange{background:#FFF0E5;color:#B94712}.price-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;align-items:start;cursor:pointer}.title{font-size:16px;font-weight:900;line-height:1.25;word-break:keep-all;overflow-wrap:anywhere}.unit{font-size:12px;font-weight:800;color:#64748B}.price-wrap{text-align:right;white-space:nowrap}.price{font-size:22px;font-weight:950;color:#2F7D5B;line-height:1.05}.date{font-size:12px;color:#64748B;font-weight:800}.meta{font-size:12px;color:#4B5563;line-height:1.45}.memo{grid-column:1/-1;color:#64748B;font-size:11.5px;line-height:1.4}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.summary-card{border:1px solid #E5E7EB;border-radius:12px;background:#F8FAFC;padding:10px;min-width:0}.summary-card b{display:block;font-size:12px;line-height:1.25}.summary-card strong{display:block;margin-top:4px;font-size:15px;color:#2F7D5B}.detail-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}.close{border:0;background:#111827;color:#fff;border-radius:999px;min-width:52px;height:32px;padding:0 10px;font-size:11px;font-weight:900;white-space:nowrap;line-height:32px;text-align:center}.chart-box{margin-top:12px;border:1px solid #E5E7EB;background:#F8FAFC;border-radius:12px;padding:8px}.chart-empty{padding:18px 8px;text-align:center;color:#64748B;font-size:12px;font-weight:800;line-height:1.55}.metric-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.metric{background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:8px;font-size:11px;color:#64748B}.metric b{display:block;color:#111827;font-size:13px;margin-top:3px}.safe{background:#FFF8E1;border-color:#FDE68A;color:#5D4400;font-size:12px;line-height:1.6;font-weight:800}.cta{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cta a{min-height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;background:#E8F6F0;color:#157A5A;border:1px solid #CDEBDD;font-size:12px;font-weight:900}.cta a:nth-child(2n){background:#111827;color:#fff;border-color:#111827}.error,.loading{background:#fff;border:1px solid #FED7AA;color:#9A3412;border-radius:14px;padding:12px;margin-bottom:8px;font-size:13px;line-height:1.6;font-weight:800}.loading{border-color:#CDEBDD;color:#157A5A}
</style></head>
<body><main class="app">
  <header class="header"><div class="top"><a class="brand" href="index.html"><img src="/static/kfarmai-logo-horizontal.png" alt="kFarmAI"></a><a class="home" href="index.html">홈</a></div><h1>농산물 시세 참고</h1><p class="sub">KAMIS 및 공공데이터 기반 시장 흐름 참고자료입니다.</p></header>
  <section class="content">
    <div class="search-row"><input id="q" class="search" placeholder="품목명 또는 초성 예: 토마토, ㅌㅁㅌ"><button id="searchBtn" class="search-btn" type="button">조회</button></div>
    <div id="chips" class="chips" aria-label="많이 확인하는 품목"></div>
    <div id="typeTabs" class="tabs" aria-label="가격 유형"></div>
    <div class="card intro"><span class="pill">시장 흐름 참고자료</span><p class="meta">소매가격, 중도매인 판매가격, 도매가격·경락가격, 친환경 소매가격을 구분해 확인합니다. 실제 거래가격은 산지, 규격, 등급, 시장, 판매처에 따라 달라질 수 있습니다.</p></div>
    <div id="status"></div>
    <div class="section-title">조회 결과 <span id="resultCount" class="result-count"></span></div>
    <div id="list"></div>
    <div id="detail"></div>
    <div class="section-title">많이 확인하는 품목 참고</div>
    <div id="fallbackList"></div>
    <div class="card safe">KAMIS 및 공공데이터 기반 시장 흐름 참고자료입니다. 실제 거래가격은 산지, 규격, 등급, 시장, 판매처에 따라 달라질 수 있습니다.</div>
    <div class="cta"><a href="agri-weather.html">농업날씨 확인</a><a href="crop-guide.html">재배가이드 확인</a><a href="links.html">관련기관 확인</a><a href="public-data.html">공공정보 확인</a></div>
  </section>
</main><script>
'use strict';
const API_BASE='https://kfarmai-api.dgilink.workers.dev';
const PRICE_TYPES=[
  {id:'retail',name:'소매가격',notice:'소비자 구입 가격 흐름을 참고합니다.'},
  {id:'middleman',name:'중도매인 판매가격',notice:'도매시장 중도매인 판매가격으로, 경락가격과 다를 수 있습니다.'},
  {id:'auction',name:'도매가격·경락가격',notice:'공영도매시장 경락가격 참고자료입니다.'},
  {id:'eco',name:'친환경 소매가격',notice:'조사주기와 품목 범위가 일반 시세와 다를 수 있습니다.'}
];
const QUICK_ITEMS=[{name:'토마토',initial:'ㅌㅁㅌ'},{name:'오이',initial:'ㅇㅇ'},{name:'딸기',initial:'ㄸㄱ'},{name:'상추',initial:'ㅅㅊ'},{name:'고추',initial:'ㄱㅊ'},{name:'배추',initial:'ㅂㅊ'},{name:'무',initial:'ㅁ'},{name:'양파',initial:'ㅇㅍ'},{name:'마늘',initial:'ㅁㄴ'},{name:'감자',initial:'ㄱㅈ'},{name:'사과',initial:'ㅅㄱ'},{name:'배',initial:'ㅂ'},{name:'쌀',initial:'ㅆ'},{name:'대파',initial:'ㄷㅍ'},{name:'깻잎',initial:'ㄲㅇ'},{name:'호박',initial:'ㅎㅂ'},{name:'가지',initial:'ㄱㅈ'},{name:'파프리카',initial:'ㅍㅍㄹㅋ'},{name:'수박',initial:'ㅅㅂ'},{name:'참외',initial:'ㅊㅇ'},{name:'포도',initial:'ㅍㄷ'},{name:'복숭아',initial:'ㅂㅅㅇ'},{name:'감귤',initial:'ㄱㄱ'},{name:'블루베리',initial:'ㅂㄹㅂㄹ'},{name:'옥수수',initial:'ㅇㅅㅅ'}];
const FALLBACK=[{item:'고추',date:'2026-07-02',type:'retail',label:'소매가격',market:'전국 참고',unit:'10kg',price:68000,memo:'시장 흐름 참고자료입니다.'},{item:'토마토',date:'2026-07-02',type:'retail',label:'소매가격',market:'전국 참고',unit:'1kg',price:5200,memo:'시장 흐름 참고자료입니다.'},{item:'딸기',date:'2026-07-02',type:'retail',label:'소매가격',market:'서울 가락 참고',unit:'2kg',price:23800,memo:'시장 흐름 참고자료입니다.'},{item:'오이',date:'2026-07-02',type:'retail',label:'소매가격',market:'전국 참고',unit:'100개',price:42000,memo:'시장 흐름 참고자료입니다.'},{item:'상추',date:'2026-07-02',type:'retail',label:'소매가격',market:'전국 참고',unit:'4kg',price:18000,memo:'시장 흐름 참고자료입니다.'}];
let selectedItem='토마토', selectedType='retail', selectedPeriod='30d', listItems=[], fallbackItems=[], detailOpen=false;
const qEl=document.getElementById('q'), chipsEl=document.getElementById('chips'), typeTabsEl=document.getElementById('typeTabs'), statusEl=document.getElementById('status'), listEl=document.getElementById('list'), detailEl=document.getElementById('detail'), fallbackListEl=document.getElementById('fallbackList'), resultCountEl=document.getElementById('resultCount');
function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function won(n){const num=Number(n);return Number.isFinite(num)&&num>0?num.toLocaleString('ko-KR')+'원':'데이터 없음'}
function normalizeQuery(text){const raw=String(text||'').trim();const byInitial=QUICK_ITEMS.find(x=>x.initial===raw);return byInitial?byInitial.name:raw}
function priceType(id){return PRICE_TYPES.find(t=>t.id===id)||PRICE_TYPES[0]}
function renderTabs(){chipsEl.innerHTML=QUICK_ITEMS.map(x=>`<button class="chip ${x.name===selectedItem?'active':''}" type="button" data-item="${esc(x.name)}">${esc(x.name)}</button>`).join('');chipsEl.querySelectorAll('.chip').forEach(btn=>btn.addEventListener('click',()=>searchItem(btn.dataset.item)));typeTabsEl.innerHTML=PRICE_TYPES.map(x=>`<button class="tab ${x.id===selectedType?'active':''}" type="button" data-type="${esc(x.id)}">${esc(x.name)}</button>`).join('');typeTabsEl.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{selectedType=btn.dataset.type;detailOpen=false;renderTabs();drawList();}));}
function cardHtml(x){return `<article class="card price-card" data-item="${esc(x.itemName||x.item)}"><div><span class="pill">${esc(x.label||priceType(x.type).name)}</span><span class="pill orange">${esc(x.market||x.source||'공공 시세')}</span></div><div class="price-wrap"><div class="price">${won(x.price)}</div><div class="date">${esc(x.date||'기준일 확인')}</div></div><div><div class="title">${esc(x.itemName||x.item||selectedItem)}</div><div class="unit">${esc(x.unit||'단위 확인')}</div></div><div class="memo">${esc(x.notice||x.memo||priceType(selectedType).notice)}</div></article>`}
function drawList(){const shown=listItems.filter(x=>x.type===selectedType);resultCountEl.textContent=shown.length?`${selectedItem} ${priceType(selectedType).name} ${shown.length}건`:'';listEl.innerHTML=shown.map(cardHtml).join('')||`<div class="card">해당 품목의 ${esc(priceType(selectedType).name)} 데이터가 없습니다. 공식 정보를 함께 확인하세요.</div>`;listEl.querySelectorAll('.price-card').forEach(card=>card.addEventListener('click',()=>openDetail(card.dataset.item||selectedItem)));fallbackListEl.innerHTML=fallbackItems.slice(0,4).map(cardHtml).join('')||'<div class="card">최근 저장 참고 목록을 준비 중입니다.</div>';detailEl.innerHTML=detailOpen?detailEl.innerHTML:'';}
async function loadFallbackItems(){try{const res=await fetch('data/market_prices.json',{cache:'no-store'});if(res.ok){const data=await res.json();if(Array.isArray(data.items)&&data.items.length)return data.items.map(x=>({...x,type:'retail',label:'소매가격'}));}}catch(e){}return FALLBACK}
async function fetchSummary(item){try{const url=new URL('/api/kamis/price-summary',API_BASE);url.searchParams.set('item',item);const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error('summary');return await res.json();}catch(e){return {ok:false,fallback:true,items:[]};}}
async function fetchTrend(item,type,period){try{const url=new URL('/api/kamis/price-trend',API_BASE);url.searchParams.set('item',item);url.searchParams.set('type',type);url.searchParams.set('period',period);const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error('trend');return await res.json();}catch(e){return {ok:false,fallback:true,points:[],summary:{}};}}
async function searchItem(text){selectedItem=normalizeQuery(text)||'토마토';qEl.value=selectedItem;detailOpen=false;renderTabs();statusEl.innerHTML='<div class="loading">공공 시세 정보를 확인하는 중입니다.</div>';const data=await fetchSummary(selectedItem);listItems=Array.isArray(data.items)?data.items:[];if(!listItems.length){listItems=fallbackItems.filter(x=>String(x.item||'').includes(selectedItem));statusEl.innerHTML='<div class="error">시세 데이터를 불러오지 못했습니다. 공식 정보를 함께 확인하세요.</div>';}else{statusEl.innerHTML=`<div class="card intro"><span class="pill">${esc(data.source||'KAMIS/aT')}</span><p class="meta">${esc(data.notice||'시장 흐름 참고자료입니다.')}</p></div>`;}drawList();}
async function openDetail(item){detailOpen=true;const previous=detailEl.innerHTML;detailEl.innerHTML=previous&&previous.includes('가격 상세내용')?previous:'';const summary=await fetchSummary(item);const trend=await fetchTrend(item,selectedType,selectedPeriod);const rows=Array.isArray(summary.items)?summary.items:[];const hasTrend=Array.isArray(trend.points)&&trend.points.length>0;detailEl.innerHTML=`<section class="card"><div class="detail-head"><div><div class="title">${esc(item)} 가격 상세내용</div><p class="meta">가격 유형별 요약과 확인 가능한 가격 흐름을 구분해 표시합니다.</p></div><button class="close" type="button" id="closeDetail">닫기</button></div><div class="summary-grid">${PRICE_TYPES.map(t=>{const row=rows.find(x=>x.type===t.id);return `<div class="summary-card"><b>${esc(t.name)}</b><strong>${won(row&&row.price)}</strong><p class="meta">${esc(row&&row.unit||'단위 확인')} · ${esc(row&&row.source||'공식 정보 확인')}</p></div>`}).join('')}</div>${hasTrend?`<div class="periods">${['7d','30d','90d','1y'].map(p=>`<button class="period ${p===selectedPeriod?'active':''}" data-period="${p}" type="button">${p}</button>`).join('')}</div><div class="chart-box">${chartSvg(trend.points)}</div>${trendSummaryHtml(trend.summary||{})}`:`<div class="chart-box"><div class="chart-empty">기간별 가격 동향 데이터는 아직 제공되지 않습니다.<br>현재 확인 가능한 가격 유형 요약만 참고하세요.</div></div>`}<p class="meta">${esc((trend.notice)||priceType(selectedType).notice)}</p></section>`;document.getElementById('closeDetail').onclick=()=>{detailOpen=false;detailEl.innerHTML=''};detailEl.querySelectorAll('.period').forEach(btn=>btn.addEventListener('click',()=>{selectedPeriod=btn.dataset.period;openDetail(item);}));}
function chartSvg(points){if(!points.length)return '<div class="chart-empty">가격 동향 데이터가 없습니다. 공식 정보를 함께 확인하세요.</div>';const prices=points.map(p=>p.price), min=Math.min(...prices), max=Math.max(...prices), span=Math.max(1,max-min), w=420,h=170,pad=18;const coords=points.map((p,i)=>{const x=pad+i*((w-pad*2)/Math.max(1,points.length-1));const y=h-pad-((p.price-min)/span)*(h-pad*2);return `${x.toFixed(1)},${y.toFixed(1)}`});return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="180" role="img" aria-label="가격 동향 그래프"><polyline points="${coords.join(' ')}" fill="none" stroke="#157A5A" stroke-width="3"/><line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#CBD5E1"/><text x="${pad}" y="14" font-size="11" fill="#64748B">${won(max)}</text><text x="${pad}" y="${h-4}" font-size="11" fill="#64748B">${won(min)}</text>${coords.map(c=>`<circle cx="${c.split(',')[0]}" cy="${c.split(',')[1]}" r="2.6" fill="#157A5A"/>`).join('')}</svg>`}
function trendSummaryHtml(s){return `<div class="metric-row"><div class="metric">최신가<b>${won(s.latest)}</b></div><div class="metric">기간 평균<b>${won(s.avg)}</b></div><div class="metric">기간 최저<b>${won(s.min)}</b></div><div class="metric">기간 최고<b>${won(s.max)}</b></div></div>`}
document.getElementById('searchBtn').addEventListener('click',()=>searchItem(qEl.value));qEl.addEventListener('keydown',e=>{if(e.key==='Enter')searchItem(qEl.value)});
(async()=>{fallbackItems=await loadFallbackItems();renderTabs();await searchItem(selectedItem)})();
</script></body></html>
