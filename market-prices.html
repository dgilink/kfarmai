<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>농산물 시세 - kFarmAI</title>
<link rel="icon" href="/static/kfarmai-logo-horizontal.png">
<meta name="description" content="농산물 시세를 판매·구매 목적이 아니라 시장 흐름 참고자료로 확인합니다.">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0a0a0a;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}a{text-decoration:none;color:inherit}.app{max-width:480px;min-height:100dvh;margin:0 auto;background:#F5F6F8}.header{background:#fff;border-bottom:1px solid #ECEEF2;padding:12px 14px 14px}.top{display:flex;align-items:center;justify-content:space-between}.brand img{max-width:180px;height:auto}.home{border:1px solid #CDEBDD;background:#E8F6F0;color:#157A5A;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:900}h1{margin-top:12px;font-size:23px}.sub{margin-top:7px;color:#6B7280;font-size:13px;line-height:1.55}.content{padding:14px 14px 90px}.search-row{display:grid;grid-template-columns:1fr 74px;gap:8px;margin-bottom:10px}.search{width:100%;height:42px;border:1.5px solid #DDE5E0;border-radius:12px;padding:0 12px;background:#fff;font-weight:800}.search-btn{height:42px;border:0;border-radius:12px;background:#157A5A;color:#fff;font-size:13px;font-weight:950;cursor:pointer}.chips{display:flex;gap:7px;overflow-x:auto;padding:0 0 10px;margin-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;border:1px solid #CDEBDD;background:#E8F6F0;color:#157A5A;border-radius:999px;padding:8px 10px;font-size:12px;font-weight:900;cursor:pointer}.chip.active{background:#157A5A;color:#fff;border-color:#157A5A}.card{background:#fff;border:1px solid #ECEEF2;border-radius:14px;padding:11px;margin-bottom:8px;box-shadow:0 6px 18px rgba(17,24,39,.04)}.intro{padding:12px}.section-title{margin:14px 0 8px;font-size:14px;font-weight:950}.result-count{margin-left:6px;color:#64748B;font-size:12px;font-weight:800}.pill{display:inline-flex;padding:4px 7px;border-radius:999px;background:#E8F6F0;color:#157A5A;font-size:10.5px;font-weight:900}.pill.orange{background:#FFF0E5;color:#B94712}.price-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;align-items:start;padding:14px 15px;margin-bottom:10px}.badge-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0}.item-line{display:flex;align-items:baseline;gap:7px;min-width:0}.title{font-size:17px;font-weight:800;line-height:1.25;min-width:0;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.unit{font-size:14px;font-weight:700;color:#64748B;white-space:nowrap}.price-wrap{text-align:right;white-space:nowrap}.price{font-size:23px;font-weight:900;color:#2F7D5B;line-height:1.05}.date{margin-top:5px;font-size:13px;color:#64748B;font-weight:700}.meta{font-size:12px;color:#4B5563;line-height:1.45}.memo{grid-column:1/-1;color:#64748B;font-size:11.5px;line-height:1.4;padding-top:2px;margin-top:0}.safe{background:#FFF8E1;border-color:#FDE68A;color:#5D4400;font-size:12px;line-height:1.6;font-weight:800}.cta{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cta a{min-height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;background:#E8F6F0;color:#157A5A;border:1px solid #CDEBDD;font-size:12px;font-weight:900}.cta a:nth-child(2n){background:#111827;color:#fff;border-color:#111827}.error,.loading{background:#fff;border:1px solid #FED7AA;color:#9A3412;border-radius:14px;padding:12px;margin-bottom:8px;font-size:13px;line-height:1.6;font-weight:800}.loading{border-color:#CDEBDD;color:#157A5A}
</style></head>
<body><main class="app">
  <header class="header"><div class="top"><a class="brand" href="index.html"><img src="/static/kfarmai-logo-horizontal.png" alt="kFarmAI"></a><a class="home" href="index.html">홈</a></div><h1>농산물 시세 참고</h1><p class="sub">농산물 시세는 판매·구매 목적이 아니라 시장 흐름 참고자료입니다.</p></header>
  <section class="content">
    <div class="search-row">
      <input id="q" class="search" placeholder="품목명 또는 초성 예: 토마토, ㅌㅁㅌ">
      <button id="searchBtn" class="search-btn" type="button">조회</button>
    </div>
    <div id="chips" class="chips" aria-label="많이 확인하는 품목"></div>
    <div class="card intro"><span class="pill">공공 시세 정보</span><p class="meta">품목, 시장, 기준일, 단위, 시세를 참고자료로 표시합니다. 출하 판단을 단정하지 않으며 공식 공공 시세 제공처 확인이 필요합니다.</p></div>
    <div id="status"></div>
    <div class="section-title">조회 결과 <span id="resultCount" class="result-count"></span></div>
    <div id="list"></div>
    <div class="section-title">많이 확인하는 품목 참고</div>
    <div id="fallbackList"></div>
    <div class="card safe">현재 시세 정보를 불러오지 못하면 최근 저장 데이터 또는 안내 카드가 표시됩니다. 공식 제공처 확인과 현장 상황을 함께 검토하세요.</div>
    <div class="cta"><a href="agri-weather.html">농업날씨 확인</a><a href="crop-guide.html">재배가이드 확인</a><a href="links.html">관련기관 확인</a><a href="public-data.html">공공정보 확인</a></div>
  </section>
</main><script>
'use strict';
let items=[];
let fallbackItems=[];
let selectedItem='토마토';
const qEl=document.getElementById('q');
const searchBtnEl=document.getElementById('searchBtn');
const chipsEl=document.getElementById('chips');
const statusEl=document.getElementById('status');
const listEl=document.getElementById('list');
const fallbackListEl=document.getElementById('fallbackList');
const resultCountEl=document.getElementById('resultCount');
const KFARMAI_API_BASE='https://kfarmai-api.dgilink.workers.dev';
const MARKET_NOTICE='농산물 시세는 판매·구매 목적이 아니라 시장 흐름 참고자료입니다.';
const FALLBACK_NOTICE='현재 KAMIS 시세 정보를 불러오지 못했습니다. 잠시 후 다시 확인하거나 공식 공공 시세 제공처를 확인해주세요.';
const QUICK_ITEMS=[{name:'토마토',initial:'ㅌㅁㅌ'},{name:'오이',initial:'ㅇㅇ'},{name:'딸기',initial:'ㄸㄱ'},{name:'상추',initial:'ㅅㅊ'},{name:'고추',initial:'ㄱㅊ'},{name:'배추',initial:'ㅂㅊ'},{name:'무',initial:'ㅁ'},{name:'양파',initial:'ㅇㅍ'},{name:'마늘',initial:'ㅁㄴ'},{name:'감자',initial:'ㄱㅈ'},{name:'사과',initial:'ㅅㄱ'},{name:'배',initial:'ㅂ'},{name:'쌀',initial:'ㅆ'},{name:'대파',initial:'ㄷㅍ'},{name:'깻잎',initial:'ㄲㅇ'}];
const FALLBACK=[{item:'고추',market:'전국 참고',date:'2026-07-02',unit:'10kg',price:68000,change:'최근 저장 데이터',memo:'출하 전 공식 공공 시세 제공처를 확인하세요.'},{item:'토마토',market:'전국 참고',date:'2026-07-02',unit:'1kg',price:5200,change:'최근 저장 데이터',memo:'시장 흐름 참고자료입니다.'},{item:'딸기',market:'서울 가락 참고',date:'2026-07-02',unit:'2kg',price:23800,change:'최근 저장 데이터',memo:'시설재배 여부에 따라 출하 시기가 달라질 수 있습니다.'},{item:'오이',market:'전국 참고',date:'2026-07-02',unit:'100개',price:42000,change:'최근 저장 데이터',memo:'공식 시세와 현장 상황을 함께 확인하세요.'},{item:'상추',market:'전국 참고',date:'2026-07-02',unit:'4kg',price:18000,change:'최근 저장 데이터',memo:'시장 흐름 확인용 참고자료입니다.'}];
function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function won(n){const num=Number(n);return Number.isFinite(num)&&num>0?num.toLocaleString('ko-KR')+'원':'시세 확인 필요'}
function value(item,keys,fallback='확인 필요'){for(const key of keys){if(item[key]!==undefined&&item[key]!==null&&item[key]!=='')return item[key]}return fallback}
function normalizeQuery(text){const raw=String(text||'').trim();const byInitial=QUICK_ITEMS.find(x=>x.initial===raw);return byInitial?byInitial.name:raw}
function renderChips(){chipsEl.innerHTML=QUICK_ITEMS.map(x=>`<button class="chip ${x.name===selectedItem?'active':''}" type="button" data-item="${esc(x.name)}">${esc(x.name)}</button>`).join('');chipsEl.querySelectorAll('.chip').forEach(btn=>btn.addEventListener('click',()=>searchItem(btn.dataset.item)))}
function cardHtml(x){const item=value(x,['item'],'품목 확인');const market=value(x,['market'],'공공 시세');const date=value(x,['date'],'기준일 확인');const unit=value(x,['unit'],'단위 확인');const type=value(x,['type'],'공공 시세 정보');const memo=value(x,['memo'],'시장 흐름 참고자료입니다.');return `<article class="card price-card"><div class="badge-row"><span class="pill">${esc(type)}</span><span class="pill orange">${esc(market)}</span></div><div class="price-wrap"><div class="price">${won(value(x,['price'],0))}</div></div><div class="item-line"><div class="title">${esc(item)}</div><div class="unit">${esc(unit)}</div></div><div class="date">${esc(date)}</div><div class="memo">${esc(memo)}</div></article>`}
function draw(){resultCountEl.textContent=items.length?`${selectedItem} 관련 시세 ${items.length}건`:'';listEl.innerHTML=items.map(cardHtml).join('')||'<div class="card">조회된 공공 시세 정보가 없습니다. 다른 품목명을 입력하거나 공식 공공 시세 제공처를 확인해주세요.</div>';fallbackListEl.innerHTML=fallbackItems.slice(0,5).map(cardHtml).join('')||'<div class="card">최근 저장 참고 목록을 준비 중입니다.</div>'}
async function loadFallbackItems(){try{const res=await fetch('data/market_prices.json',{cache:'no-store'});if(res.ok){const data=await res.json();if(Array.isArray(data.items)&&data.items.length)return data.items;}}catch(e){}return FALLBACK}
async function loadWorkerPrices(item){if(!KFARMAI_API_BASE)return null;try{const url=new URL('/api/kamis/prices',KFARMAI_API_BASE);url.searchParams.set('item',item||'토마토');const res=await fetch(url.toString(),{cache:'no-store'});if(!res.ok)return null;const data=await res.json();if(Array.isArray(data.items)&&data.items.length&&!data.fallback)return {items:data.items,fallback:false};}catch(e){}return null}
async function searchItem(text){const item=normalizeQuery(text)||'토마토';selectedItem=item;qEl.value=item;renderChips();statusEl.innerHTML='<div class="loading">KAMIS 공공 시세 정보를 확인하는 중입니다.</div>';const worker=await loadWorkerPrices(item);if(worker){items=worker.items;statusEl.innerHTML=`<div class="card intro"><span class="pill">KAMIS</span><p class="meta">${MARKET_NOTICE}</p></div>`;draw();return}items=fallbackItems.filter(x=>String(value(x,['item'],'')).includes(item));if(!items.length)items=fallbackItems;statusEl.innerHTML=`<div class="error">${FALLBACK_NOTICE}</div>`;draw()}
searchBtnEl.addEventListener('click',()=>searchItem(qEl.value));
qEl.addEventListener('keydown',event=>{if(event.key==='Enter')searchItem(qEl.value)});
(async()=>{fallbackItems=await loadFallbackItems();renderChips();await searchItem(selectedItem)})();
</script></body></html>
