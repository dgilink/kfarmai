    <rect x="56" y="563" width="1088" height="64" fill="#eef8f6"/>
    <circle cx="88" cy="595" r="10" fill="#ef8b3a"/>
    <text x="112" y="605" fill="#17211d" font-size="28" font-weight="800">가동 직후에는 끝단 토출과 작물의 수분 반응까지 확인하세요.</text>
    <text x="1144" y="657" fill="#0a7b83" font-size="22" font-weight="800" text-anchor="end">kFarmAI</text>
