    <rect x="64" y="782" width="1072" height="2" fill="#d9e2dc"/>
    <text x="64" y="834" fill="#536159" font-size="24" font-weight="600">가동 직후에는 끝단 토출과 작물별 수분 반응도 함께 확인하세요.</text>
    <text x="1136" y="834" fill="#167246" font-size="22" font-weight="800" text-anchor="end">kFarmAI</text>
