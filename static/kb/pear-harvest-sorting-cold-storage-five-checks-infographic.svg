<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1310" viewBox="0 0 840 1310" role="img" aria-labelledby="infTitle infDesc">
<title id="infTitle">수확한 배 저장관리 5가지 핵심 점검</title>
<desc id="infDesc">과실 선별, 5~7일 예비건조, 저장온도 0도와 습도 85~90%, 냉기 통로 30~50센티미터, 저장 중 정기 점검</desc>
<defs>
  <linearGradient id="headerGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#103B2E"/><stop offset="1" stop-color="#247456"/></linearGradient>
  <linearGradient id="goldPear" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8E3AA"/><stop offset=".55" stop-color="#E4BC67"/><stop offset="1" stop-color="#C99C44"/></linearGradient>
</defs>
<!-- Full bleed on white: no grey background, outer card, or framing margin -->
<rect width="840" height="1310" fill="#FFFFFF"/>
<rect width="840" height="282" fill="url(#headerGreen)"/>
<path d="M0 282H840" stroke="#CFA659" stroke-width="4"/>
<text x="37" y="54" font-family="Malgun Gothic,Noto Sans CJK KR,Apple SD Gothic Neo,sans-serif" font-size="23" font-weight="600" fill="#DAEFE2" letter-spacing="1">KFARMAI  /  농업정보</text>
<text x="37" y="121" font-family="Malgun Gothic,Noto Sans CJK KR,Apple SD Gothic Neo,sans-serif" font-size="52" font-weight="800" fill="#FFFFFF">수확한 배, 저장관리</text>
<text x="37" y="175" font-family="Malgun Gothic,Noto Sans CJK KR,Apple SD Gothic Neo,sans-serif" font-size="45" font-weight="800" fill="#F5D99E">5가지 핵심 점검</text>
<rect x="35" y="202" width="188" height="67" rx="9" fill="#FFFFFF" opacity=".13"/>
<rect x="235" y="202" width="218" height="67" rx="9" fill="#FFFFFF" opacity=".13"/>
<text x="52" y="225" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="21" fill="#DBEDDF">저장온도</text>
<text x="52" y="257" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="35" font-weight="800" fill="#FFFFFF">0℃</text>
<text x="252" y="225" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="21" fill="#DBEDDF">상대습도</text>
<text x="252" y="257" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="35" font-weight="800" fill="#FFFFFF">85~90%</text>
<path d="M702 127C687 103 650 108 633 143C620 171 637 194 639 218C641 256 666 271 706 271C751 271 774 243 766 206C760 183 770 161 754 143C738 123 719 114 702 127Z" fill="url(#goldPear)" stroke="#F8DFAB" stroke-width="2"/>
<path d="M703 126Q715 106 728 94" fill="none" stroke="#855F37" stroke-width="7" stroke-linecap="round"/>
<path d="M714 111Q746 85 769 104Q743 125 714 111Z" fill="#93C28A"/>
<g data-check="01">
  <rect x="12" y="302" width="816" height="174" rx="14" fill="#FFFFFF" stroke="#D4E3D8" stroke-width="2"/>
  <rect x="12" y="319" width="7" height="140" fill="#287B55"/>
  <circle cx="81" cy="353" r="30" fill="#206A4D"/>
  <text x="81" y="363" text-anchor="middle" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="27" font-weight="800" fill="#FFFFFF">01</text>
  <text x="134" y="364" font-family="Malgun Gothic,Noto Sans CJK KR,Apple SD Gothic Neo,sans-serif" font-size="38" font-weight="750" fill="#103E2D">피해 과실 먼저 선별</text>
  <text x="46" y="419" font-family="Malgun Gothic,Noto Sans CJK KR,Apple SD Gothic Neo,sans-serif" font-size="30" font-weight="600" fill="#294E3C">열과 · 상처 · 무름 · 부패 과실 분리</text>
  <text x="46" y="455" font-family="Malgun Gothic,Noto Sans CJK KR,Apple SD Gothic Neo,sans-serif" font-size="25" fill="#5A7162">정상 과실과 섞어 저장하지 않기</text>
</g>
<g data-check="02">
  <rect x="12" y="486" width="816" height="174" rx="14" fill="#FFFFFF" stroke="#D4E3D8" stroke-width="2"/>
  <rect x="12" y="503" width="7" height="140" fill="#CBA057"/>
  <circle cx="81" cy="537" r="30" fill="#206A4D"/>
  <text x="81" y="547" text-anchor="middle" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="27" font-weight="800" fill="#FFFFFF">02</text>
  <text x="134" y="548" font-family="Malgun Gothic,Noto Sans CJK KR,Apple SD Gothic Neo,sans-serif" font-size="38" font-weight="750" fill="#103E2D">그늘에서 예비 건조</text>
  <text x="46" y="603" font-family="Malgun Gothic,Noto Sans CJK KR,Apple SD Gothic Neo,sans-serif" font-size="30" font-weight="600" fill="#294E3C">통풍이 잘 되는 곳에서 5~7일</text>
  <text x="46" y="639" font-family="Malgun Gothic,Noto Sans CJK KR,Apple SD Gothic Neo,sans-serif" font-size="25" fill="#5A7162">건전한 과실만 저장고에 입고</text>
</g>
<g data-check="03">
  <rect x="12" y="670" width="816" height="174" rx="14" fill="#FFFFFF" stroke="#D4E3D8" stroke-width="2"/>
  <rect x="12" y="687" width="7" height="140" fill="#287B55"/>
  <circle cx="81" cy="721" r="30" fill="#206A4D"/>
  <text x="81" y="731" text-anchor="middle" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="27" font-weight="800" fill="#FFFFFF">03</text>
  <text x="134" y="732" font-family="Malgun Gothic,Noto Sans CJK KR,Apple SD Gothic Neo,sans-serif" font-size="38" font-weight="750" fill="#103E2D">저온·습도 일정하게</text>
  <text x="46" y="787" font-family="Malgun Gothic,Noto Sans CJK KR,Apple SD Gothic Neo,sans-serif" font-size="30" font-weight="600" fill="#294E3C">저장온도 0℃ · 상대습도 85~90%</text>
  <text x="46" y="823" font-family="Malgun Gothic,Noto Sans CJK KR,Apple SD Gothic Neo,sans-serif" font-size="25" fill="#5A7162">온·습도 센서와 과실 상태 확인</text>
</g>
<g data-check="04">
  <rect x="12" y="854" width="816" height="174" rx="14" fill="#FFFFFF" stroke="#D4E3D8" stroke-width="2"/>
  <rect x="12" y="871" width="7" height="140" fill="#CBA057"/>
  <circle cx="81" cy="905" r="30" fill="#206A4D"/>
  <text x="81" y="915" text-anchor="middle" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="27" font-weight="800" fill="#FFFFFF">04</text>
  <text x="134" y="916" font-family="Malgun Gothic,Noto Sans CJK KR,Apple SD Gothic Neo,sans-serif" font-size="38" font-weight="750" fill="#103E2D">냉기 통로 확보</text>
  <text x="46" y="971" font-family="Malgun Gothic,Noto Sans CJK KR,Apple SD Gothic Neo,sans-serif" font-size="30" font-weight="600" fill="#294E3C">벽과 상자 사이 30~50cm 간격</text>
  <text x="46" y="1007" font-family="Malgun Gothic,Noto Sans CJK KR,Apple SD Gothic Neo,sans-serif" font-size="25" fill="#5A7162">공기 흐름을 막는 적재 피하기</text>
</g>
<g data-check="05">
  <rect x="12" y="1038" width="816" height="174" rx="14" fill="#FFFFFF" stroke="#D4E3D8" stroke-width="2"/>
  <rect x="12" y="1055" width="7" height="140" fill="#287B55"/>
  <circle cx="81" cy="1089" r="30" fill="#206A4D"/>
  <text x="81" y="1099" text-anchor="middle" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="27" font-weight="800" fill="#FFFFFF">05</text>
  <text x="134" y="1100" font-family="Malgun Gothic,Noto Sans CJK KR,Apple SD Gothic Neo,sans-serif" font-size="38" font-weight="750" fill="#103E2D">저장 중 품질 확인</text>
  <text x="46" y="1155" font-family="Malgun Gothic,Noto Sans CJK KR,Apple SD Gothic Neo,sans-serif" font-size="30" font-weight="600" fill="#294E3C">부패 여부를 정기적으로 점검</text>
  <text x="46" y="1191" font-family="Malgun Gothic,Noto Sans CJK KR,Apple SD Gothic Neo,sans-serif" font-size="25" fill="#5A7162">외기온을 고려해 환기하기</text>
</g>
<rect x="12" y="1230" width="816" height="59" rx="9" fill="#164934"/>
<text x="36" y="1255" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="23" font-weight="700" fill="#F8DBA7">핵심 원칙</text>
<text x="36" y="1280" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="23" fill="#FFFFFF">피해 과실 분리 → 예건 → 저온저장 → 정기 점검</text>
</svg>