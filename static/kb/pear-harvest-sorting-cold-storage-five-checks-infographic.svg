<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1392" viewBox="0 0 840 1392" role="img" aria-labelledby="infTitle infDesc">
<title id="infTitle">수확한 배, 저장 전후 점검 5가지</title>
<desc id="infDesc">선별, 예비 건조, 0도와 상대습도 85~90%, 적재 간격 30~50센티미터, 저장 중 품질점검</desc>
<defs>
<linearGradient id="forest" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#143F32"/><stop offset="1" stop-color="#267A5B"/></linearGradient>
<linearGradient id="pear" x1="0" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#F2D99A"/><stop offset=".55" stop-color="#E4BA62"/><stop offset="1" stop-color="#C48F37"/></linearGradient>
</defs>
<rect width="840" height="1392" fill="#EDF1EB"/>
<rect x="16" y="16" width="808" height="1360" rx="30" fill="#FFF"/>
<rect x="36" y="36" width="768" height="315" rx="24" fill="url(#forest)"/>
<circle cx="720" cy="110" r="140" fill="#FFFFFF" opacity=".045"/>
<circle cx="760" cy="277" r="130" fill="#FFFFFF" opacity=".05"/>
<text x="66" y="91" font-family="Apple SD Gothic Neo,Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="27" fill="#D4E5D9" letter-spacing="2">KFARMAI  /  농업정보</text>
<text x="66" y="159" font-family="Apple SD Gothic Neo,Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="54" font-weight="800" fill="#FFFFFF">수확한 배, 저장관리</text>
<text x="66" y="217" font-family="Apple SD Gothic Neo,Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="43" font-weight="750" fill="#F4DAA5">5가지 핵심 점검</text>
<rect x="65" y="246" width="179" height="77" rx="12" fill="#FFFFFF" opacity=".14"/>
<text x="82" y="282" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="20" fill="#F4EFD9">저장온도</text>
<text x="82" y="310" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="37" font-weight="800" fill="#FFFFFF">0℃</text>
<rect x="258" y="246" width="214" height="77" rx="12" fill="#FFFFFF" opacity=".14"/>
<text x="275" y="282" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="20" fill="#F4EFD9">상대습도</text>
<text x="275" y="310" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="35" font-weight="800" fill="#FFFFFF">85~90%</text>
<path d="M707 164c-30-44-78-16-78 19c0 16 11 31 10 49c-2 30 19 53 53 53c38 0 57-25 55-55c-1-20 15-35 8-52c-10-26-32-31-48-14Z" fill="url(#pear)" stroke="#F7E3B7" stroke-width="2"/>
<path d="M695 163q8-26 26-40" fill="none" stroke="#815F38" stroke-width="7" stroke-linecap="round"/>
<path d="M713 140q26-21 46-4q-24 24-46 4" fill="#83B276"/>

<rect x="43" y="376" width="754" height="160" rx="18" fill="#F2F7F2" stroke="#DCE7DC" stroke-width="2"/>
<rect x="43" y="392" width="7" height="127" rx="3.5" fill="#267552"/>
<circle cx="108" cy="433" r="36" fill="#226B52"/>
<text x="108" y="445" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">01</text>
<text x="164" y="437" font-family="Apple SD Gothic Neo,Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="36" font-weight="780" fill="#0C3328">피해 과실 먼저 선별</text>
<text x="72" y="484" font-family="Apple SD Gothic Neo,Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="28" font-weight="650" fill="#2C5140">열과 · 상처 · 무름 · 부패 과실 분리</text>
<text x="72" y="515" font-family="Apple SD Gothic Neo,Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="23" fill="#67786C">건전 과실과 섞어 저장하지 않기</text>
<rect x="43" y="555" width="754" height="160" rx="18" fill="#F8F7F2" stroke="#DCE7DC" stroke-width="2"/>
<rect x="43" y="571" width="7" height="127" rx="3.5" fill="#D2AA60"/>
<circle cx="108" cy="612" r="36" fill="#226B52"/>
<text x="108" y="624" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">02</text>
<text x="164" y="616" font-family="Apple SD Gothic Neo,Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="36" font-weight="780" fill="#0C3328">그늘에서 예비 건조</text>
<text x="72" y="663" font-family="Apple SD Gothic Neo,Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="28" font-weight="650" fill="#2C5140">통풍이 잘 되는 곳에서 5~7일</text>
<text x="72" y="694" font-family="Apple SD Gothic Neo,Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="23" fill="#67786C">정상 과실을 건조한 뒤 입고</text>
<rect x="43" y="734" width="754" height="160" rx="18" fill="#F2F7F2" stroke="#DCE7DC" stroke-width="2"/>
<rect x="43" y="750" width="7" height="127" rx="3.5" fill="#267552"/>
<circle cx="108" cy="791" r="36" fill="#226B52"/>
<text x="108" y="803" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">03</text>
<text x="164" y="795" font-family="Apple SD Gothic Neo,Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="36" font-weight="780" fill="#0C3328">저온·습도 일정하게</text>
<text x="72" y="842" font-family="Apple SD Gothic Neo,Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="28" font-weight="650" fill="#2C5140">저장온도 0℃  ·  상대습도 85~90%</text>
<text x="72" y="873" font-family="Apple SD Gothic Neo,Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="23" fill="#67786C">저장고 센서와 실제 표시값 확인</text>
<rect x="43" y="913" width="754" height="160" rx="18" fill="#F8F7F2" stroke="#DCE7DC" stroke-width="2"/>
<rect x="43" y="929" width="7" height="127" rx="3.5" fill="#D2AA60"/>
<circle cx="108" cy="970" r="36" fill="#226B52"/>
<text x="108" y="982" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">04</text>
<text x="164" y="974" font-family="Apple SD Gothic Neo,Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="36" font-weight="780" fill="#0C3328">냉기 통로 확보</text>
<text x="72" y="1021" font-family="Apple SD Gothic Neo,Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="28" font-weight="650" fill="#2C5140">벽·상자 사이 30~50cm 간격</text>
<text x="72" y="1052" font-family="Apple SD Gothic Neo,Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="23" fill="#67786C">공기 흐름을 막는 적재 피하기</text>
<rect x="43" y="1092" width="754" height="160" rx="18" fill="#F2F7F2" stroke="#DCE7DC" stroke-width="2"/>
<rect x="43" y="1108" width="7" height="127" rx="3.5" fill="#267552"/>
<circle cx="108" cy="1149" r="36" fill="#226B52"/>
<text x="108" y="1161" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">05</text>
<text x="164" y="1153" font-family="Apple SD Gothic Neo,Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="36" font-weight="780" fill="#0C3328">저장 중 품질 확인</text>
<text x="72" y="1200" font-family="Apple SD Gothic Neo,Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="28" font-weight="650" fill="#2C5140">정기적인 상태 점검과 환기</text>
<text x="72" y="1231" font-family="Apple SD Gothic Neo,Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="23" fill="#67786C">외기온이 저장고와 비슷할 때 환기</text>
<rect x="45" y="1285" width="749" height="75" rx="14" fill="#184C38"/>
<text x="66" y="1316" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="25" font-weight="750" fill="#FFFFFF">핵심 원칙</text>
<text x="66" y="1342" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="22" fill="#D8E9DD">피해 과실 분리 → 예건 → 저온저장 → 정기 점검</text>
</svg>