<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1120" viewBox="0 0 760 1120" role="img" aria-labelledby="t d"><title id="t">밀·보리 파종 전후 점검 5가지</title><desc id="d">토양 수분, 배수로, 지역별 파종시기, 늦파종 종자량, 파종 후 관리</desc><rect width="760" height="1120" fill="#eef6f1"/><rect x="20" y="20" width="720" height="1080" rx="22" fill="#fff"/><rect x="37" y="42" width="686" height="182" rx="18" fill="#174c37"/><text x="68" y="91" fill="#dbefdf" font-family="sans-serif" font-size="27">KFARMAI · 농업정보</text><text x="67" y="148" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="46">가을비 뒤 밀·보리 파종</text><text x="67" y="192" fill="#fff" font-family="sans-serif" font-size="29">지금 확인할 다섯 가지</text><rect x="40" y="251" width="680" height="137" rx="16" fill="#edf7ef"/><circle cx="88" cy="296" r="32" fill="#26824c"/><text x="88" y="307" text-anchor="middle" font-size="30" font-family="sans-serif" font-weight="bold" fill="#fff">01</text><text x="142" y="307" font-family="sans-serif" font-weight="bold" font-size="35" fill="#1e4231">토양 수분</text><foreignObject x="60" y="328" width="620" height="56"><div xmlns="http://www.w3.org/1999/xhtml" style="font:23px/1.35 sans-serif;color:#334f3f">논바닥이 지나치게 질면 파종을 서두르지 않습니다.</div></foreignObject><rect x="40" y="401" width="680" height="137" rx="16" fill="#f7faf7"/><circle cx="88" cy="446" r="32" fill="#26824c"/><text x="88" y="457" text-anchor="middle" font-size="30" font-family="sans-serif" font-weight="bold" fill="#fff">02</text><text x="142" y="457" font-family="sans-serif" font-weight="bold" font-size="35" fill="#1e4231">물길 확보</text><foreignObject x="60" y="478" width="620" height="56"><div xmlns="http://www.w3.org/1999/xhtml" style="font:23px/1.35 sans-serif;color:#334f3f">고랑·배수구의 흙과 볏짚을 제거하고 배수로를 연결합니다.</div></foreignObject><rect x="40" y="551" width="680" height="137" rx="16" fill="#edf7ef"/><circle cx="88" cy="596" r="32" fill="#26824c"/><text x="88" y="607" text-anchor="middle" font-size="30" font-family="sans-serif" font-weight="bold" fill="#fff">03</text><text x="142" y="607" font-family="sans-serif" font-weight="bold" font-size="35" fill="#1e4231">지역별 파종기</text><foreignObject x="60" y="628" width="620" height="56"><div xmlns="http://www.w3.org/1999/xhtml" style="font:23px/1.35 sans-serif;color:#334f3f">남부 적기 10월 20일~11월 10일, 지역·품종별 조정합니다.</div></foreignObject><rect x="40" y="701" width="680" height="137" rx="16" fill="#f7faf7"/><circle cx="88" cy="746" r="32" fill="#26824c"/><text x="88" y="757" text-anchor="middle" font-size="30" font-family="sans-serif" font-weight="bold" fill="#fff">04</text><text x="142" y="757" font-family="sans-serif" font-weight="bold" font-size="35" fill="#1e4231">늦파종 대응</text><foreignObject x="60" y="778" width="620" height="56"><div xmlns="http://www.w3.org/1999/xhtml" style="font:23px/1.35 sans-serif;color:#334f3f">불가피한 늦파종은 표준 대비 파종량 20~30% 증량을 검토합니다.</div></foreignObject><rect x="40" y="851" width="680" height="137" rx="16" fill="#edf7ef"/><circle cx="88" cy="896" r="32" fill="#26824c"/><text x="88" y="907" text-anchor="middle" font-size="30" font-family="sans-serif" font-weight="bold" fill="#fff">05</text><text x="142" y="907" font-family="sans-serif" font-weight="bold" font-size="35" fill="#1e4231">파종 뒤 관리</text><foreignObject x="60" y="928" width="620" height="56"><div xmlns="http://www.w3.org/1999/xhtml" style="font:23px/1.35 sans-serif;color:#334f3f">물이 고이지 않도록 고랑을 살피고 월동 전 생육을 관찰합니다.</div></foreignObject><text x="43" y="1051" fill="#53675b" font-family="sans-serif" font-size="20">출처: 농촌진흥청(2026.10.16·10.26)</text><text x="43" y="1081" fill="#53675b" font-family="sans-serif" font-size="17">파종량과 시비는 품종·파종방법·토양검정 결과에 맞춰 조정</text></svg>