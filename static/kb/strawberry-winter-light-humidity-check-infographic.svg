<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1120" viewBox="0 0 760 1120" role="img" aria-labelledby="t d"><title id="t">딸기 하우스 겨울 전 다섯 가지 점검</title><desc id="d">채광, 보온, 습도 환기, 관수, 생육 다섯 가지 점검표</desc><rect width="760" height="1120" fill="#f0f7f1"/><rect x="16" y="18" width="728" height="1084" rx="20" fill="white"/><text x="45" y="81" font-size="27" font-family="sans-serif" fill="#28794e">KFARMAI  |  재배 체크리스트</text><text x="45" y="146" font-size="48" font-weight="bold" font-family="sans-serif" fill="#19412c">딸기 하우스 겨울 준비</text><text x="45" y="193" font-size="26" font-family="sans-serif" fill="#486556">오늘 확인할 다섯 가지</text><rect x="35" y="235" width="690" height="138" rx="18" fill="#e9f5ec"/><circle cx="88" cy="287" r="34" fill="#257b4d"/><text x="88" y="298" font-family="sans-serif" text-anchor="middle" font-size="28" font-weight="bold" fill="white">01</text><text x="143" y="288" font-family="sans-serif" font-size="37" font-weight="bold" fill="#1b3d2c">채광</text><text x="60" y="335" font-family="sans-serif" font-size="24" fill="#334f3d">피복재 오염 확인</text><text x="60" y="363" font-family="sans-serif" font-size="22" fill="#496755">햇빛이 잘 들어오도록 관리</text><rect x="35" y="391" width="690" height="138" rx="18" fill="#f3f7f4"/><circle cx="88" cy="443" r="34" fill="#257b4d"/><text x="88" y="454" font-family="sans-serif" text-anchor="middle" font-size="28" font-weight="bold" fill="white">02</text><text x="143" y="444" font-family="sans-serif" font-size="37" font-weight="bold" fill="#1b3d2c">보온</text><text x="60" y="491" font-family="sans-serif" font-size="24" fill="#334f3d">보온커튼·난방기 점검</text><text x="60" y="519" font-family="sans-serif" font-size="22" fill="#496755">야간 온도 변화에 대비</text><rect x="35" y="547" width="690" height="138" rx="18" fill="#e9f5ec"/><circle cx="88" cy="599" r="34" fill="#257b4d"/><text x="88" y="610" font-family="sans-serif" text-anchor="middle" font-size="28" font-weight="bold" fill="white">03</text><text x="143" y="600" font-family="sans-serif" font-size="37" font-weight="bold" fill="#1b3d2c">습도·환기</text><text x="60" y="647" font-family="sans-serif" font-size="24" fill="#334f3d">결로·습한 구역 확인</text><text x="60" y="675" font-family="sans-serif" font-size="22" fill="#496755">열손실을 고려해 공기 순환</text><rect x="35" y="703" width="690" height="138" rx="18" fill="#f3f7f4"/><circle cx="88" cy="755" r="34" fill="#257b4d"/><text x="88" y="766" font-family="sans-serif" text-anchor="middle" font-size="28" font-weight="bold" fill="white">04</text><text x="143" y="756" font-family="sans-serif" font-size="37" font-weight="bold" fill="#1b3d2c">관수</text><text x="60" y="803" font-family="sans-serif" font-size="24" fill="#334f3d">흐린 날 토양·배지 수분 확인</text><text x="60" y="831" font-family="sans-serif" font-size="22" fill="#496755">과습하지 않도록 조절</text><rect x="35" y="859" width="690" height="138" rx="18" fill="#e9f5ec"/><circle cx="88" cy="911" r="34" fill="#257b4d"/><text x="88" y="922" font-family="sans-serif" text-anchor="middle" font-size="28" font-weight="bold" fill="white">05</text><text x="143" y="912" font-family="sans-serif" font-size="37" font-weight="bold" fill="#1b3d2c">생육</text><text x="60" y="959" font-family="sans-serif" font-size="24" fill="#334f3d">잎과 열매 상태 관찰</text><text x="60" y="987" font-family="sans-serif" font-size="22" fill="#496755">이상 증상은 정확히 진단</text><text x="46" y="1062" font-family="sans-serif" font-size="21" fill="#456553">농촌진흥청 자료 기반 · 현장 조건에 맞춰 확인</text></svg>