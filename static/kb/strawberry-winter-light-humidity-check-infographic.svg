<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">딸기 하우스 겨울 전 점검 인포그래픽</title><desc id="d">빛, 보온, 습도, 관수, 식물 상태 5가지 점검</desc><rect width="1200" height="720" fill="#eef7f0"/><rect x="44" y="38" rx="30" width="1112" height="644" fill="#fff"/><text x="92" y="112" font-family="sans-serif" font-size="30" fill="#288153">KFARMAI · 재배 체크</text><text x="92" y="181" font-family="sans-serif" font-size="51" font-weight="bold" fill="#193c2e">딸기 하우스 겨울 전 점검</text><text x="92" y="231" font-family="sans-serif" font-size="26" fill="#46695b">빛 · 보온 · 습도 · 관수 · 생육</text><rect x="94" y="286" width="1012" height="62" rx="14" fill="#f7faf8"/><text x="119" y="326" font-size="29" font-family="sans-serif" fill="#278553" font-weight="bold">01</text><text x="204" y="326" font-family="sans-serif" font-size="28" fill="#25392d" font-weight="bold">피복재 상태</text><text x="450" y="326" font-family="sans-serif" font-size="23" fill="#53675d">먼지·오염을 점검해 햇빛이 잘 들어오도록 관리</text><rect x="94" y="358" width="1012" height="62" rx="14" fill="#f0f6f2"/><text x="119" y="398" font-size="29" font-family="sans-serif" fill="#278553" font-weight="bold">02</text><text x="204" y="398" font-family="sans-serif" font-size="28" fill="#25392d" font-weight="bold">야간 보온</text><text x="450" y="398" font-family="sans-serif" font-size="23" fill="#53675d">보온커튼과 난방기를 미리 점검</text><rect x="94" y="430" width="1012" height="62" rx="14" fill="#f7faf8"/><text x="119" y="470" font-size="29" font-family="sans-serif" fill="#278553" font-weight="bold">03</text><text x="204" y="470" font-family="sans-serif" font-size="28" fill="#25392d" font-weight="bold">하우스 습도</text><text x="450" y="470" font-family="sans-serif" font-size="23" fill="#53675d">습한 공기가 오래 머물지 않도록 환기·순환 확인</text><rect x="94" y="502" width="1012" height="62" rx="14" fill="#f0f6f2"/><text x="119" y="542" font-size="29" font-family="sans-serif" fill="#278553" font-weight="bold">04</text><text x="204" y="542" font-family="sans-serif" font-size="28" fill="#25392d" font-weight="bold">관수량</text><text x="450" y="542" font-family="sans-serif" font-size="23" fill="#53675d">흐리고 비가 오는 날은 과습을 피하도록 조정</text><rect x="94" y="574" width="1012" height="62" rx="14" fill="#f7faf8"/><text x="119" y="614" font-size="29" font-family="sans-serif" fill="#278553" font-weight="bold">05</text><text x="204" y="614" font-family="sans-serif" font-size="28" fill="#25392d" font-weight="bold">잎·열매 상태</text><text x="450" y="614" font-family="sans-serif" font-size="23" fill="#53675d">병든 부위를 관찰하고 초기 이상을 신속히 확인</text><text x="95" y="675" font-family="sans-serif" font-size="17" fill="#53675d">출처: 농촌진흥청(2025.11.13) · 작물 생육 조건과 현장 설비에 맞춰 적용</text></svg>